region: fra
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
services:
  environment_slug: node-js
  github:
    branch: main
    repo: masumi-network/sokosumi
  http_port: 3000
  instance_count: 1
  instance_size_slug: ${INSTANCE_SIZE_SLUG}
  name: sokosumi-web-app
  source_dir: web-app
