region: fra
databases:
- engine: PG
  name: db
  version: 16
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
features:
- buildpack-stack=ubuntu-22
services:
  environment_slug: node-js
  envs:
  - key: BETTER_AUTH_SECRET
    scope: RUN_AND_BUILD_TIME
    value: ${BETTER_AUTH_SECRET} 
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${db.DATABASE_URL}    
  - key: SEED_DATABASE
    scope: BUILD_TIME
    value: ${SEED_DATABASE}
  github:
    branch: digitalocean-deployment
    repo: masumi-network/sokosumi
  http_port: 3000
  instance_count: 1
  instance_size_slug: ${INSTANCE_SIZE_SLUG}
  name: sokosumi-web-app
  source_dir: web-app
