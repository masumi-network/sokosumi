region: fra
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
databases:
- engine: PG
  name: db
envs:
- key: BETTER_AUTH_SECRET
  scope: RUN_AND_BUILD_TIME
  value: ${BETTER_AUTH_SECRET}
- key: DATABASE_URL
  scope: RUN_AND_BUILD_TIME
  value: postgres://postgres:postgres@localhost:5432/postgres
features:
- buildpack-stack=ubuntu-22
services:
  github:
    branch: main
    repo: masumi-network/sokosumi
  http_port: 3000
  instance_count: 1
  instance_size_slug: ${INSTANCE_SIZE_SLUG}
  name: sokosumi-web-app
  source_dir: web-app
