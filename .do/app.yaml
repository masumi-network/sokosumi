region: fra
alerts:
- rule: DEPLOYMENT_FAILED
- rule: DOMAIN_FAILED
envs:
  - key: BETTER_AUTH_SECRET
    scope: RUN_AND_BUILD_TIME
    value: ${BETTER_AUTH_SECRET}
features:
- buildpack-stack=ubuntu-22
services:
  environment_slug: node-js
  envs:
  - key: DATABASE_URL
    scope: RUN_AND_BUILD_TIME
    value: ${DATABASE_URL}
  - key: TEST_ENV
    scope: RUN_AND_BUILD_TIME
    value: test
  github:
    branch: digitalocean-deployment
    repo: masumi-network/sokosumi
  http_port: 3000
  instance_count: 1
  instance_size_slug: ${INSTANCE_SIZE_SLUG}
  name: sokosumi-web-app
  source_dir: web-app
