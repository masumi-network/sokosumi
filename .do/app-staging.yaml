name: sokosumi-dev
services:
  - name: sokosumi-web-app  
    envs:
    - key: DATABASE_URL
      value: ${DATABASE_URL}
      type: SECRET
    - key: BETTER_AUTH_SECRET
      value: ${BETTER_AUTH_SECRET}
      type: SECRET
    github:
      branch: main
      repo: masumi-network/sokosumi
    source_dir: web-app