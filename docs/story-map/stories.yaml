stories:
  - id: US-01
    persona: new
    want: "to create an account with my email"
    so_that: "I can start using Sokosumi"
    screens: [signup]
    status: unverified
    notes: "Form renders. Submit not run: sign-up needs an emailed code that the local build only prints to the Core console."
  - id: US-02
    persona: user
    want: "to log in with my email and password"
    so_that: "I reach my workspace"
    screens: [signin-email, signin-password, home]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/(welcome)/page.tsx"
    notes: "Logged in as two demo accounts through the UI: email step, password step, then Home (or Setup for the account without a workspace)."
  - id: US-03
    persona: user
    want: "to see a clear message when my password is wrong"
    so_that: "I can fix it and try again"
    screens: [signin-password, signin-error]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(auth)/components/auth-flow.tsx"
    notes: "A wrong password shows the toast 'Invalid email or password'."
  - id: US-04
    persona: user
    want: "to log in with a one-time code emailed to me"
    so_that: "I do not need my password"
    screens: [signin-password, signin-code]
    status: unverified
    notes: "Code step renders with a resend timer; entering a code was not run."
  - id: US-05
    persona: user
    want: "to reset a forgotten password"
    so_that: "I get back into my account"
    screens: [signin-password, forgot-password]
    status: unverified
    notes: "Reset form renders; sending the reset email was not run (no email provider locally)."
  - id: US-06
    persona: new
    want: "to choose a personal or organization workspace on my first login"
    so_that: "I land in the right place"
    screens: [setup]
    status: unverified
    notes: "A demo account without a workspace is redirected to Setup after login and sees the form. Submitting Continue was not run."
  - id: US-07
    persona: new
    want: "to accept an invitation to an organization"
    so_that: "I join my team's workspace"
    screens: [invite-accept]
    status: unverified
    notes: "Needs an invitation id from a second account."
  - id: US-08
    persona: user
    want: "to land on a Home screen with a summary of the last 24 hours"
    so_that: "I see at a glance what my coworkers did"
    screens: [home]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/(welcome)/page.tsx"
    notes: "Welcome message and three counters (tasks completed, minutes worked, tasks needing input)."
  - id: US-09
    persona: user
    want: "to switch between Everything and a single project"
    so_that: "I focus on one body of work"
    screens: [home, workspace-switcher]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/layout.tsx"
    notes: "The switcher lists Everything, recent projects, Create project and Manage projects."
  - id: US-10
    persona: user
    want: "to see my tasks as a board by status"
    so_that: "I know what is in progress"
    screens: [tasks-board]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/tasks/(root)/page.tsx"
    notes: "Board columns Backlog, Todo and more, with demo tasks assigned to demo coworkers."
  - id: US-11
    persona: user
    want: "to see scheduled work on a calendar"
    so_that: "I know when things run"
    screens: [tasks-calendar]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/tasks/(root)/page.tsx"
    notes: "Agenda view renders; it was empty for the demo data ('No scheduled releases')."
  - id: US-12
    persona: user
    want: "to change how the board is displayed"
    so_that: "I can read it my way"
    screens: [tasks-board, tasks-filter]
    status: unverified
    notes: "The display menu (Board/List, Normal/Compact) opens; switching was not run."
  - id: US-13
    persona: user
    want: "to create a task and assign it to a coworker"
    so_that: "work starts without a meeting"
    screens: [tasks-board, task-new]
    status: unverified
    notes: "The New task sheet opens with assignee choices and Start from scratch. Submitting from the UI was not run (demo tasks were created through the Core API)."
  - id: US-14
    persona: user
    want: "to open a task and see its status and activity"
    so_that: "I can follow what happened"
    screens: [tasks-board, task-detail]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/tasks/[taskId]/page.tsx"
    notes: "Detail shows identifier, status, assignee, project and an activity log."
  - id: US-15
    persona: user
    want: "to open a completed task and read its description, properties and parent task"
    so_that: "I can review finished work"
    screens: [tasks-board, task-completed]
    status: built
    verified: "local demo + production task view, 2026-10-16"
    where: "apps/web/src/app/(app)/tasks/[taskId]/page.tsx"
    notes: "Production: identifier, share and more buttons, Description, Properties, Auto tags, Parent task. Title, description, assignee, organization masked."
  - id: US-16
    persona: user
    want: "to edit a task"
    so_that: "I can correct the brief"
    screens: [task-detail, task-edit]
    status: unverified
    notes: "Edit form renders with the task's data. Saving was not run."
  - id: US-17
    persona: user
    want: "to browse my projects"
    so_that: "I find the right one quickly"
    screens: [projects]
    status: built
    verified: "local build, demo data, 2026-10-15"
    where: "apps/web/src/app/(app)/projects/(root)/page.tsx"
    notes: "Two demo projects with briefings."
  - id: US-18
    persona: user
    want: "to create a project in three steps"
    so_that: "I can group related tasks"
    screens: [projects, project-new]
    status: unverified
    notes: "Step 1 of 3 (name) renders; steps 2 and 3 and saving were not run."
  - id: US-19
    persona: user
    want: "to open a project and see its properties"
    so_that: "I understand its state"
    screens: [project-detail]
