gaps:
  - id: G-01
    severity: high
    title: "No native iPhone or Android app"
    detail: "The only native app is macOS (apps/apple). On phones people use the responsive web app or a PWA, so this map is for the web app at mobile width."
    where: "apps/apple/README.md"
    stories: [US-48]
  - id: G-02
    severity: medium
    title: "Billing page shows a generic error when Stripe is not configured"
    detail: "Opening Billing without Stripe keys gives 'Something went wrong. Try again' with no hint what is missing. Local-only, but a configuration failure in production would look the same."
    where: "apps/web/src/app/(app)/billing/page.tsx"
    stories: [US-35]
  - id: G-03
    severity: medium
    title: "Chat rooms need realtime keys locally; only seen in production"
    detail: "Without Ably keys a local chat room shows a 'Something went wrong' modal (docs/agents/local-development.md). The room was captured read-only in production with its content masked, so message bubbles, reactions and threads inside a room are not mapped."
    where: "docs/agents/local-development.md"
    stories: [US-24]
  - id: G-04
    severity: low
    title: "Content Studio template images are broken in the local build"
    detail: "The poster template shows a broken-image icon; likely the dummy blob token, not verified."
    where: "apps/web/src/app/(app)/studio/page.tsx"
    stories: [US-28]
  - id: G-05
    severity: low
    title: "Social and Ads are beta-gated and only their entry screens are mapped"
    detail: "The local demo account gets a 404 for /social and /ads. In production only the Social week calendar and the Ads Pick a project screen were viewed; Drafts, Needs attention, post creation, ad accounts and campaigns were not opened."
    where: "apps/web/src/app/(app)/social/page.tsx"
    stories: [US-29, US-30]
  - id: G-06
    severity: low
    title: "Admin console is mapped only at its landing page"
    detail: "About 40 routes under /admin plus the vendor and developer consoles are staff tools. Only the Admin landing page was viewed; no admin page was opened because they list other people's data."
    where: "apps/web/src/app/(app)/admin/page.tsx"
  - id: G-07
    severity: medium
    title: "Sign-up and code sign-in cannot be completed locally"
    detail: "Both need an emailed code; locally the code is only printed in the Core console, so the success path was not run."
    where: "apps/web/src/app/(auth)/signup/page.tsx"
    stories: [US-01, US-04]
  - id: G-08
    severity: low
    title: "/calendar redirects to the Tasks calendar tab"
    detail: "There is no separate calendar screen; /calendar opens Tasks with the calendar view, so it is not mapped twice."
    where: "apps/web/src/app/(app)/calendar/page.tsx"
  - id: G-09
    severity: medium
    title: "Billing could not be seen beyond the access-restricted message"
    detail: "In the production workspace used for the capture a member only sees Billing access restricted. Plan, payment method and invoices need an organization owner or admin account, or the personal context, and were not captured; locally Billing needs Stripe test keys."
    where: "apps/web/src/app/(app)/billing/page.tsx"
    stories: [US-35]
  - id: G-10
    severity: low
    title: "Production screenshots are masked"
    detail: "Ten production screens hide names, emails, avatars, the organization name and logo, chat and thread text and private task text behind grey blocks, so their content cannot be read by design. Layout, controls and numbers are real."
    where: "docs/story-map/screens"
  - id: G-11
    severity: medium
    title: "Public share page and invitation acceptance are not captured"
    detail: "Both need a link or id that only a real shared task or a second account can create. They are marked not_captured and their stories stay unverified."
    where: "apps/web/src/app/share/[token]/page.tsx"
    stories: [US-47, US-07]
