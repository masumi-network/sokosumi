# Sokosumi (web app) - story map source. The one file to edit; then run `storymap.py validate && storymap.py build` (user-story-maps skill).
app:
  name: Sokosumi
  platform: web
  device: browser-window
  version: "main @ 57fb09e7e (apps/web, mobile width 390x844)"
  checked: 2026-10-16
  summary: "Marketplace where people give tasks to AI coworkers and follow the results (mobile web app, PWA; macOS app, no iOS app)."
  disclaimer: "Local demo data plus 10 read-only production screens; names, emails, avatars, organization, chats and private text are masked (G-10)."

theme:
  font: Inter
  heading_font: Inter
  google_font: true
  primary: "#2B5C78"
  background: "#FFFFFF"
  surface: "#F5F5F5"
  border: "#E2E2E2"
  text: "#0A0A0A"
  muted: "#707070"
  status:
    built: "#137638"
    partly: "#C77A12"
    unverified: "#5B7FA6"
    missing: "#8A8F98"
  severity:
    high: "#BA1C1C"
    medium: "#C77A12"
    low: "#8A8F98"
  device:
    style: black
    badge: label

personas:
  - id: new
    name: "New user"
    as_a: "new user"
    description: "Opens Sokosumi for the first time and needs an account and a workspace."
  - id: user
    name: "Workspace member"
    as_a: "workspace member"
    description: "Assigns work to AI coworkers and follows the results."
  - id: owner
    name: "Account owner"
    as_a: "account owner"
    description: "Manages credits, billing, connections and the organization."
  - id: dev
    name: "Developer"
    as_a: "developer"
    description: "Builds coworkers or integrates through API keys and OAuth clients."

topics:
  - id: onboarding
    title: "Onboarding"
    description: "First-run workspace setup and invitations."
  - id: access
    title: "Login & account access"
    description: "Email, password and one-time-code sign-in, sign-up, password reset."
  - id: journey
    title: "Main journey: tasks with AI coworkers"
    description: "Home, tasks, projects, chat, coworkers, schedules, studio."
  - id: library
    title: "Files & library"
    description: "Files and tables produced in the workspace."
  - id: settings
    title: "Settings & account"
    description: "You menu, account, notifications, connections, developer tools, organization."
  - id: payments
    title: "Credits & billing"
    description: "Credit balance and history, plan billing."
  - id: support
    title: "Support & system pages"
    description: "Help, legal, maintenance, not found, shared links."

flows:
  - id: signin
    title: "Sign in and sign up"
    topic: access
    description: "Email first, then password or one-time code; new accounts register here."
    edges:
      - "signin-email -> signin-password: Enter email, Continue with email"
      - "signin-email -> signup: Register"
      - "signin-password -> signin-error: (Wrong password)"
      - "signin-password -> signin-code: Email me a code instead"
      - "signin-password -> forgot-password: Forgot password?"
      - "signin-password -> home: Log in"
  - id: first-run
    title: "First-run workspace setup"
    topic: onboarding
    description: "A new account with no workspace picks how it works before reaching Home."
    edges:
      - "signin-password -> setup: (First login, no workspace yet)"
      - "setup -> home: Continue"
      - "signin-email -> invite-accept: (Open an invitation link)"
      - "invite-accept -> home: (Accept)"
  - id: home-nav
    title: "Home and navigation"
    topic: journey
    description: "Home is the hub: bottom tabs, workspace switcher, search, notifications."
    edges:
      - "home -> workspace-switcher: Tap the project switcher"
      - "home -> notifications: Tap the bell"
      - "home -> tasks-board: Tasks tab"
      - "home -> chat: Chats tab"
      - "home -> projects: Projects tab"
      - "home -> you: You tab"
      - "home -> history-search: Tap the search icon"
      - "history-search -> credit-history: (Clear the search)"
  - id: tasks
    title: "Tasks"
    topic: journey
    description: "Board and calendar of work assigned to coworkers; create, open and edit a task."
    edges:
      - "tasks-board -> task-new: Tap +"
      - "tasks-board -> tasks-filter: Tap the display menu"
      - "tasks-board -> tasks-calendar: Calendar tab"
      - "tasks-board -> task-detail: Tap a task"
      - "task-detail -> task-edit: Edit"
      - "tasks-board -> task-completed: Tap a completed task"
  - id: projects
    title: "Projects"
    topic: journey
    description: "Group related tasks under a project with a briefing and memory."
    edges:
      - "projects -> project-new: Tap +"
      - "projects -> project-detail: Tap a project"
      - "project-detail -> project-memory: Memory tab"
      - "project-detail -> project-edit: Edit"
  - id: coworkers
    title: "Chat and coworkers"
    topic: journey
    description: "Chat inbox, threads and the coworker gallery used to start new work."
    edges:
      - "chat -> chat-threads: Threads"
      - "chat -> agents: (Search agents link in the coworker picker)"
      - "agents -> agent-detail: Tap a coworker"
      - "agent-detail -> task-new: Start a new task for the coworker"
      - "chat -> chat-room: (Open a conversation)"
      - "chat -> soko-bots: Soko Bots"
      - "soko-bots -> soko-bots-live: (Workspace with an active assistant)"
      - "chat-threads -> threads-live: (Workspace with conversations)"
      - "home -> personal-assistant: (Assistant entry, sidebar on desktop)"
  - id: planning
    title: "Schedules, calendar and studio"
    topic: journey
    description: "Recurring tasks, the release calendar and image generation."
    edges:
      - "you -> schedules: Schedules"
      - "schedules -> schedule-new: New schedule"
      - "you -> studio: Content Studio"
      - "you -> social: Social Scheduling"
      - "you -> ads: Ads"
  - id: files
    title: "Files, tables and history"
    topic: library
    description: "Files and tables the workspace has produced, and workspace search."
    edges:
      - "you -> drive: Files"
      - "drive -> drive-tables: Tables tab"
  - id: you-menu
    title: "You menu and account settings"
    topic: settings
    description: "Everything personal and administrative lives under the You tab."
    edges:
      - "you -> account: Account"
      - "you -> account-notifications: Notifications"
      - "you -> connections: Connections"
      - "you -> you-developer: Developer"
      - "you-developer -> api-keys: API keys"
      - "you-developer -> oauth-clients: OAuth clients"
      - "you-developer -> dev-coworkers: Coworkers"
      - "you -> organization: (Organization workspace)"
      - "you -> you-live: (Workspace with plan and usage)"
      - "you -> admin: Admin"
  - id: credits
    title: "Credits and billing"
    topic: payments
    description: "Credit balance, history and plan management."
    edges:
      - "you -> credit-history: Credit history"
      - "you -> billing: Billing"
      - "billing -> credit-history: (Credit history)"
      - "credit-history -> credit-history-live: (Workspace with real usage)"
  - id: support
    title: "Help, legal and system pages"
    topic: support
    description: "Help and legal menus, plus the maintenance and not-found pages."
    edges:
      - "you -> you-help: Help"
      - "you -> you-legal: Legal"
      - "signin-email -> maintenance: (Maintenance mode)"
      - "signin-email -> not-found: (Unknown address)"
      - "signin-email -> share-page: (Open a shared link)"

