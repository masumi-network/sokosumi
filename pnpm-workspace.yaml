packages:
  - apps/*
  - packages/*

# pnpm 12 defaults this to `install`. After a filtered Vercel install
# (`--filter web...`), turbo's `pnpm run build` treats node_modules as
# stale and re-installs the whole workspace. Nested `pnpm run` in package
# prepare scripts (`pnpm build`) stringifies `false` to "false", which pnpm
# treats as truthy (pnpm#12019). Use `warn`, not `false`.
verifyDepsBeforeRun: warn
minimumReleaseAge: 0
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMintimeout: 15000
fetchRetryMaxtimeout: 120000
networkConcurrency: 8

overrides:
  # js-yaml GHSA-52cp-r559-cp3m (quadratic CPU via merge-key chains) and
  # GHSA-5p4m-2wfm-xmqj (quadratic CPU in !!omap resolution, CVE-2026-59870).
  # @hey-api/json-schema-ref-parser@1.4.4 still pins js-yaml@4.2.0 (vulnerable).
  # Patched floor is 4.3.1; pin latest 4.x patch.
  "js-yaml@<4.3.2": "4.3.2"
  # esbuild GHSA-g7r4-m6w7-qqqr (Windows dev-server arbitrary file read) — tsup
  # still depends on esbuild@^0.27.0, which lands 0.27.7 without this pin.
  # Patched floor is 0.28.1; pin latest 0.28.x.
  "esbuild@<0.28.2": "0.28.2"
  # undici 7.x GHSAs (cache replay of unsafe methods GHSA-8436-99hf-9mmv, plus
  # earlier SOCKS5 / WebSocket / header injection). @scalar/json-magic@0.15.2
  # (via openapi-to-markdown 1.3.0) still pins 7.29.0 (vulnerable; floor 7.29.1).
  # Do not use undici@<7.30.0 — that would also rewrite @vercel/blob's 6.x.
  # Pin latest 7.x (7.30.0).
  "undici@>=7.0.0 <7.30.0": "7.30.0"
  # eve@0.67.2 still pins undici@8.9.0. GHSA-8436-99hf-9mmv covers
  # >=8.0.0 <8.10.2. Pin latest 8.x. Selector starts at 8 so 6.x/7.x stay put.
  "undici@>=8.0.0 <8.11.2": "8.11.2"

ignoredOptionalDependencies:
  # `pdfjs-dist` declares `@napi-rs/canvas` as an optional dependency, for
  # rendering PDF pages to images. Files extraction reads the **text layer
  # only** and never rasterizes, so nothing here calls it.
  #
  # Installing it is not free and not neutral: it brings 11 platform-specific
  # packages of prebuilt native code, 34 MB for linux-x64-gnu alone, into a
  # tree that then has to ship it to a serverless function. Native code is
  # also the one kind of dependency whose failures are not contained by the
  # JavaScript sandbox the parser process relies on.
  #
  # pdfjs falls back cleanly when it is absent — `getTextContent` does not
  # touch canvas. There is a test asserting text extraction works without it.
  - "@napi-rs/canvas"

allowBuilds:
  # pnpm 11+: workspace prepare scripts are blocked unless listed (strictDepBuilds).
  # These packages compile to dist/ on install; without them, Next/Turbopack cannot resolve exports.
  "@sokosumi/ai-provider": true
  "@sokosumi/email": true
  "@sokosumi/masumi": true
  "@sokosumi/net": true
  "@sokosumi/soko-bot": true
  "@sokosumi/utils": true
  prisma: true
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  "@sentry-internal/node-cpu-profiler": false
  "@sentry/node-cpu-profiler": true
  "@sentry/cli": false
  "@swc/core": false
  "@tailwindcss/oxide": false
  "@vercel/speed-insights": false
  better-sqlite3: false
  esbuild: false
  puppeteer: false
  puppeteer-core: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

publicHoistPattern:
  - import-in-the-middle
  - require-in-the-middle
  - "@prisma/client"
  - "@prisma/adapter-pg"
  - pg
  - pg-pool
  - "@biomejs/biome"

# Workaround: TypeScript 7 drops Assertion.not from Vitest 5's mapped Chai types.
# Re-check when bumping vitest or typescript; drop the patch if tsc is clean without it.
# Upstream: https://github.com/vitest-dev/vitest/issues/11144 (still open on 5.0.2)
patchedDependencies:
  vitest@5.0.2: patches/vitest@5.0.2.patch
