packages:
  - apps/*
  - packages/*

minimumReleaseAge: 0
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMintimeout: 15000
fetchRetryMaxtimeout: 120000
networkConcurrency: 8

overrides:
  docx: "9.7.1"
  lodash: 4.18.1
  zod: 4.4.3
  samlify: 2.13.1
  # Force-patch vulnerable transitive copies (direct deps already safe):
  # postcss <8.5.10 (XSS in CSS stringify) pulled by next.
  postcss@<8.5.10: ">=8.5.10"
  # @hono/node-server <1.19.13 (serveStatic middleware bypass) pinned at 1.19.11
  # by @prisma/dev. Patch within the 1.x line (fix backported to 1.19.13) rather
  # than forcing @prisma/dev onto a major bump.
  "@hono/node-server@<1.19.13": ">=1.19.13 <2"
  # ws GHSA-58qx-3vcg-4xpx (uninitialized memory disclosure) — @vercel/functions@3.7.0
  # ships ws@8.20.0 (vulnerable). Force all ws 8.x resolutions to the patched line.
  "ws@>=8.0.0 <8.20.1": "8.21.0"
  # esbuild GHSA-gv7w-rqvm-qjhr (RCE in Deno via NPM_CONFIG_REGISTRY) and
  # GHSA-g7r4-m6w7-qqqr (Windows dev-server arbitrary file read) — transitive
  # via vite@8.0.16 (esbuild@0.27.7) and tsup@8.5.1. Force all resolving copies
  # below the patched line to 0.28.1.
  "esbuild@<0.28.1": "0.28.1"

allowBuilds:
  # pnpm 11: workspace prepare scripts are blocked unless listed (strictDepBuilds).
  # These packages compile to dist/ on install; without them, Next/Turbopack cannot resolve exports.
  "@sokosumi/ai-provider": true
  "@sokosumi/chat": true
  "@sokosumi/database": true
  "@sokosumi/email": true
  "@sokosumi/masumi": true
  "@sokosumi/utils": true
  prisma: true
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  "@sentry-internal/node-cpu-profiler": false
  "@sentry/cli": false
  "@swc/core": false
  "@tailwindcss/oxide": false
  "@vercel/speed-insights": false
  better-sqlite3: false
  esbuild: false
  puppeteer: false
  puppeteer-core: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

publicHoistPattern:
  - bun-types
  - import-in-the-middle
  - require-in-the-middle
  - "@prisma/client"
  - "@prisma/adapter-pg"
  - pg
  - pg-pool
  - "@biomejs/biome"
