packages:
  - apps/*
  - packages/*

# pnpm 12 defaults this to `install`. After a filtered Vercel install
# (`--filter web...`), turbo's `pnpm run build` treats node_modules as
# stale and re-installs the whole workspace. Nested `pnpm run` in package
# prepare scripts (`pnpm build`) stringifies `false` to "false", which pnpm
# treats as truthy (pnpm#12019). Use `warn`, not `false`.
verifyDepsBeforeRun: warn
minimumReleaseAge: 0
fetchTimeout: 300000
fetchRetries: 5
fetchRetryMintimeout: 15000
fetchRetryMaxtimeout: 120000
networkConcurrency: 8

overrides:
  # js-yaml GHSA-2883-xcg3-v3hh, GHSA-5p4m-2wfm-xmqj, GHSA-52cp-r559-cp3m.
  # Patched in 4.3.2 (`v4-legacy`). 5.x is a separate major; do not force it.
  # 2026-11-13 re-resolve without overrides landed js-yaml@4.2.0 via
  # @hey-api/json-schema-ref-parser@1.4.4 (still latest; still depends on 4.2.0).
  # Audit reported all three GHSAs. npm `latest` is 5.5.0.
  "js-yaml@<4.3.2": "4.3.2"
  # undici GHSA-mqg3-3v4r-cm32 (and GHSA-7xg3-fphp-28hg, GHSA-5rm8-gv32-r954,
  # GHSA-9v6h-8rgp-m69f, GHSA-3g9m-rv3r-w5w2, GHSA-r4pc-4jcp-7pqc) fixed in
  # 7.30.2 and 8.12.4. 6.x is not named. Audit does not index these GHSAs.
  # 2026-11-13 re-resolve without overrides landed 6.29.1, 7.30.2, 8.12.3, and
  # 8.12.4. eve 1.0.0-rc.13 still depends on 8.12.3. No 6.x or 7.x pin.
  "undici@>=8.12.2 <8.12.4": "8.12.4"
  # zod GHSA-mrhx-c7xc-m3w5 patched in 4.6.6. 2026-11-10: @vercel/oidc 3.8.10
  # and 4.0.0 (via @vercel/blob 2.9.0 and @vercel/sandbox 3.9.1, both latest)
  # pin @vercel/cli-config 0.3.1, which pins zod 4.1.11. Workspace pins are
  # already 4.6.7.
  # 2026-11-13 re-resolve with overrides removed landed zod@4.1.11 and
  # zod@4.6.7. pnpm audit reported GHSA-mrhx-c7xc-m3w5. 4.6.7 is still npm
  # `latest`. The 4.x floor stays.
  "zod@>=4.0.0 <4.6.6": "4.6.7"
  # zod GHSA-mrhx-c7xc-m3w5 has no 3.x fix. 2026-11-11: puppeteer and
  # puppeteer-core 25.11.0 (held to match @sparticuz/chromium-min 153.0.0, the
  # newest pack; see apps/web/src/config/env.secrets.test.ts) depend on
  # chromium-bidi 17.0.2, which asks for zod ^3.24.1. Puppeteer 25.13+ moves to
  # chromium-bidi 157 and zod 4 but needs Chrome 155. chromium-bidi is loaded
  # only for Firefox or `protocol: "webDriverBiDi"` (puppeteer-core
  # BrowserLauncher `import("../bidi/bidi.js")`). Every launch here uses
  # Chrome over the default CDP, so this zod is not loaded at runtime. Its
  # protocol-parser reads `error.errors`, which zod 4 removed: drop this pin
  # before anything launches with webDriverBiDi, and when puppeteer moves past
  # 25.12.
  # 2026-11-13 re-resolve with overrides removed still landed zod@3.25.76 from
  # chromium-bidi@17.0.2. Puppeteer stays 25.11.0 (Chrome 153). pnpm audit
  # reported GHSA-mrhx-c7xc-m3w5 for that zod. The parent pin stays.
  "chromium-bidi@17.0.2>zod": "4.6.7"
  # katex GHSA-238p-pmpm-9mq7 (low) patched in 0.18.2. 2026-11-11: micromark-extension-math
  # 3.1.0 (latest, via remark-math 6.0.0, @m2d/math and @lobehub/ui) still asks
  # for katex ^0.16.0. remark-math only parses here; katex runs only in the
  # extension's HTML renderer (`lib/html.js`, `katex.renderToString`), which no
  # code here uses. 0.19.1 matches the katex @lobehub/ui already resolves.
  # 2026-11-13 re-resolve with overrides removed landed katex@0.16.47 beside
  # 0.18.10 and 0.19.1. micromark-extension-math 3.1.0 (still latest) still
  # depends on katex ^0.16.0. pnpm audit reported GHSA-238p-pmpm-9mq7. npm
  # `latest` is 0.19.1. The parent pin stays.
  "micromark-extension-math>katex": "0.19.1"
  # postcss-selector-parser GHSA-rj75-hqrm-r3gf patched in 6.1.5.
  # @tailwindcss/typography 0.5.20 (latest) pins 6.0.10. 6.1.6 is the newest 6.x.
  # 2026-11-13 re-resolve with overrides removed landed only
  # postcss-selector-parser@6.0.10. @tailwindcss/typography 0.5.20 is still
  # latest and still depends on 6.0.10. pnpm audit reported GHSA-rj75-hqrm-r3gf.
  # 6.1.6 is still the newest 6.x (`legacy-v6`). npm `latest` is 7.2.1; not forced.
  "postcss-selector-parser@>=6.0.0 <6.1.5": "6.1.6"
  # esbuild GHSA-g7r4-m6w7-qqqr: dropped. 2026-11-13 re-resolve without an
  # override landed only esbuild@0.28.2. npm `latest` is 0.28.2.
ignoredOptionalDependencies:
  # `pdfjs-dist` declares `@napi-rs/canvas` as an optional dependency, for
  # rendering PDF pages to images. Files extraction reads the **text layer
  # only** and never rasterizes, so nothing here calls it.
  #
  # Installing it is not free and not neutral: it brings 11 platform-specific
  # packages of prebuilt native code, 34 MB for linux-x64-gnu alone, into a
  # tree that then has to ship it to a serverless function. Native code is
  # also the one kind of dependency whose failures are not contained by the
  # JavaScript sandbox the parser process relies on.
  #
  # pdfjs falls back cleanly when it is absent — `getTextContent` does not
  # touch canvas. There is a test asserting text extraction works without it.
  - "@napi-rs/canvas"

allowBuilds:
  # pnpm 11+: workspace prepare scripts are blocked unless listed (strictDepBuilds).
  # These packages compile to dist/ on install; without them, Next/Turbopack cannot resolve exports.
  "@sokosumi/ai-provider": true
  "@sokosumi/core-client": true
  "@sokosumi/email": true
  "@sokosumi/masumi": true
  "@sokosumi/net": true
  "@sokosumi/soko-bot": true
  "@sokosumi/utils": true
  prisma: true
  "@parcel/watcher": false
  "@prisma/client": false
  "@prisma/engines": false
  "@sentry-internal/node-cpu-profiler": false
  "@sentry/node-cpu-profiler": true
  "@sentry/cli": false
  "@swc/core": false
  "@tailwindcss/oxide": false
  "@vercel/speed-insights": false
  better-sqlite3: false
  esbuild: false
  puppeteer: false
  puppeteer-core: false
  sharp: false
  unrs-resolver: false
  vue-demi: false

publicHoistPattern:
  - import-in-the-middle
  - require-in-the-middle
  - "@prisma/client"
  - "@prisma/adapter-pg"
  - pg
  - pg-pool
  - "@biomejs/biome"

# Workaround: TypeScript 7 drops Assertion.not from Vitest 5's mapped Chai types.
# Re-check when bumping vitest or typescript; drop the patch if tsc is clean without it.
# Upstream: https://github.com/vitest-dev/vitest/issues/11144 (closed without the field; still missing on 5.1.0)
patchedDependencies:
  vitest@5.1.0: patches/vitest@5.1.0.patch
