# SwiftLint config for the Apple clients. Run from apps/apple:
# `mint run swiftlint lint --strict`. CI runs the same command (see apple.yml).
#
# Formatting (indent, spacing, imports) belongs to SwiftFormat
# (see .swiftformat); this file stays to semantic lint rules.

# Test targets carry long inline fixture payloads (Core JSON, data URIs);
# wrapping them buys nothing and SwiftFormat does not wrap, so line length
# stays unchecked.
#
# Length caps are off too: SwiftUI views (ContentView) and fixture-heavy
# test targets (ChatServiceTests) legitimately exceed them, and splitting
# them is out of scope for style enforcement.
disabled_rules:
  - line_length
  - type_body_length
  - file_length

opt_in_rules:
  - anyobject_protocol
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - first_where
  - last_where
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument

included:
  - Packages
  - Sokosumi
  - SokosumiTests

excluded:
  # SwiftPM build output and fetched dependencies, when present locally.
  - Packages/*/.build
