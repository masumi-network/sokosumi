name: Setup
description: Install pnpm, Node.js, and workspace dependencies

inputs:
  turbo_team:
    description: Vercel team slug for Turborepo Remote Cache (OIDC)
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        install: false

    # No pnpm store cache, on purpose. Across 30 Biome/Typecheck jobs a
    # restored ~514 MB store made Setup slower (25.6s) than installing from
    # the registry (20.4s), and every PR-scoped miss spent another ~10s in
    # Post Setup saving a copy no sibling PR can read — ~20 identical copies
    # filled the repo's 10 GB cache. Caching node_modules itself does not
    # help either: a 426 MB tree took 14.6s to restore (9.7s of it tar
    # extraction), against 14.5–16.5s for the install (#5165).
    # `package-manager-cache: false` stops
    # setup-node enabling it from the `packageManager` field.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    - name: Install Dependencies
      run: pnpm install
      shell: bash

    - name: Set up Turborepo Remote Cache
      if: ${{ inputs.turbo_team != '' }}
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
      with:
        team: ${{ inputs.turbo_team }}
