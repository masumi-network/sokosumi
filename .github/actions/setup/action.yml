name: Setup
description: Install pnpm, Node.js, and workspace dependencies

inputs:
  turbo_team:
    description: Vercel team slug for Turborepo Remote Cache (OIDC)
    required: false
    default: ""
  ffmpeg:
    description: >-
      "true" for a job that runs ffmpeg (Core's avatar tests). It gets our
      copy of the pinned build; every other job skips ffmpeg-static's
      download.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        install: false

    # No pnpm store cache, on purpose. Across 30 Biome/Typecheck jobs a
    # restored ~514 MB store made Setup slower (25.6s) than installing from
    # the registry (20.4s), and every PR-scoped miss spent another ~10s in
    # Post Setup saving a copy no sibling PR can read — ~20 identical copies
    # filled the repo's 10 GB cache. Caching node_modules itself does not
    # help either: a 426 MB tree took 14.6s to restore (9.7s of it tar
    # extraction), against 14.5–16.5s for the install (#5165).
    # `package-manager-cache: false` stops
    # setup-node enabling it from the `packageManager` field.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # ffmpeg-static's install script downloads an ~80 MB binary from GitHub
    # Releases, and a 504 there failed every job of every PR (2026-11-08)
    # though only Core's avatar tests run ffmpeg. The script skips the
    # download when FFMPEG_BIN names an existing file. A job without ffmpeg
    # points it at a stub that fails loudly if anything calls it; Test Core
    # points it at Core's DEFAULT_FFMPEG_BUILD (our copy of that release
    # asset), checked against its hash. ci:test keeps the two in step.
    - name: Point ffmpeg-static at a binary
      shell: bash
      env:
        WANTS_FFMPEG: ${{ inputs.ffmpeg }}
        FFMPEG_URL: https://igcd4cnfvuav1zto.public.blob.vercel-storage.com/vendor/ffmpeg-static/b6.1.1/ffmpeg-linux-x64-Kat8TFEc5GgKu9hryOAPTb3VpUHuG9.gz
        FFMPEG_SHA256: bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
      run: |
        bin="$RUNNER_TEMP/ffmpeg"
        if [ "$WANTS_FFMPEG" = "true" ]; then
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            --output "$bin.gz" "$FFMPEG_URL"
          echo "$FFMPEG_SHA256  $bin.gz" | sha256sum --check --quiet
          gunzip "$bin.gz"
        else
          printf '#!/bin/sh\necho "ffmpeg is not installed in this job: pass ffmpeg: \\"true\\" to the Setup action" >&2\nexit 1\n' > "$bin"
        fi
        chmod +x "$bin"
        echo "FFMPEG_BIN=$bin" >> "$GITHUB_ENV"

    - name: Install Dependencies
      run: pnpm install
      shell: bash

    - name: Set up Turborepo Remote Cache
      if: ${{ inputs.turbo_team != '' }}
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
      with:
        team: ${{ inputs.turbo_team }}
