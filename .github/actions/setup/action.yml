name: Setup
description: Install pnpm, Node.js, and workspace dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v6

    - uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "pnpm"

    - name: Install Dependencies
      run: pnpm install
      shell: bash
