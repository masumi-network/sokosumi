name: Setup
description: Install pnpm, Node.js, and workspace dependencies

inputs:
  turbo_team:
    description: Vercel team slug for Turborepo Remote Cache (OIDC)
    required: false
    default: ""
  ffmpeg:
    description: >-
      "true" for a job that runs ffmpeg (Core's avatar tests). It gets the
      binary from the cache next-build-cache.yml saves on main; every other
      job skips ffmpeg-static's download.
    required: false
    default: "false"

outputs:
  ffmpeg-cache-key:
    description: The cache key the ffmpeg binary is saved under
    value: ${{ steps.ffmpeg-key.outputs.key }}
  ffmpeg-cache-hit:
    description: '"true" when the binary came from the cache'
    value: ${{ steps.ffmpeg-cache.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/setup@v2
      with:
        install: false

    # No pnpm store cache, on purpose. Across 30 Biome/Typecheck jobs a
    # restored ~514 MB store made Setup slower (25.6s) than installing from
    # the registry (20.4s), and every PR-scoped miss spent another ~10s in
    # Post Setup saving a copy no sibling PR can read — ~20 identical copies
    # filled the repo's 10 GB cache. Caching node_modules itself does not
    # help either: a 426 MB tree took 14.6s to restore (9.7s of it tar
    # extraction), against 14.5–16.5s for the install (#5165).
    # `package-manager-cache: false` stops
    # setup-node enabling it from the `packageManager` field.
    - uses: actions/setup-node@v7
      with:
        node-version-file: .nvmrc
        package-manager-cache: false

    # ffmpeg-static's install script downloads an ~80 MB binary from GitHub
    # Releases, and a 504 there failed every job of every PR (2026-11-08)
    # though only Core's avatar tests run ffmpeg. The script skips the
    # download when FFMPEG_BIN names an existing file, so a job without
    # ffmpeg points it at a stub that fails loudly if anything calls it,
    # and Test Core points it at the cached binary.
    - name: Key the ffmpeg binary
      id: ffmpeg-key
      if: ${{ inputs.ffmpeg == 'true' }}
      shell: bash
      run: >-
        echo "key=js-ffmpeg-static-$(node -p "require('./apps/core/package.json').dependencies['ffmpeg-static']")-${{ runner.os }}-${{ runner.arch }}"
        >> "$GITHUB_OUTPUT"

    - name: Restore the ffmpeg binary
      id: ffmpeg-cache
      if: ${{ inputs.ffmpeg == 'true' }}
      uses: actions/cache/restore@v6
      with:
        path: ~/.cache/sokosumi/ffmpeg
        key: ${{ steps.ffmpeg-key.outputs.key }}

    - name: Point ffmpeg-static at a binary
      shell: bash
      env:
        WANTS_FFMPEG: ${{ inputs.ffmpeg }}
        CACHE_HIT: ${{ steps.ffmpeg-cache.outputs.cache-hit }}
      run: |
        if [ "$WANTS_FFMPEG" != "true" ]; then
          stub="$RUNNER_TEMP/ffmpeg-not-installed"
          printf '#!/bin/sh\necho "ffmpeg is not installed in this job: pass ffmpeg: \\"true\\" to the Setup action" >&2\nexit 1\n' > "$stub"
          chmod +x "$stub"
          echo "FFMPEG_BIN=$stub" >> "$GITHUB_ENV"
        elif [ "$CACHE_HIT" = "true" ]; then
          echo "FFMPEG_BIN=$HOME/.cache/sokosumi/ffmpeg" >> "$GITHUB_ENV"
        fi

    - name: Install Dependencies
      run: pnpm install
      shell: bash

    - name: Set up Turborepo Remote Cache
      if: ${{ inputs.turbo_team != '' }}
      continue-on-error: true
      uses: vercel/setup-turborepo-remote-cache-action@v1.0.0
      with:
        team: ${{ inputs.turbo_team }}
