name: Setup
description: Install pnpm, Node.js, and workspace dependencies

runs:
  using: composite
  steps:
    - name: Install pnpm
      uses: pnpm/action-setup@v4

    - uses: actions/setup-node@v4
      with:
        node-version: "24"
        cache: "pnpm"

    - name: Install Dependencies
      run: pnpm install
      shell: bash

    - name: Generate Prisma Client
      run: pnpm prisma:generate
      shell: bash
