name: Playwright
description: Install web's Playwright WebKit and Chromium with their apt packages, from the cache when it has them

# `playwright install --with-deps` apt-installs ~190 packages (119 MB) from
# the runner's Ubuntu mirror. On 2026-10-27 that mirror delivered 35 of them in
# 14 minutes. Pointing apt's archive directory into a cached folder lets apt
# install the .deb files it already has and download only what changed; the
# browsers come from the cache the same way. next-build-cache.yml saves the
# cache from main, and Test Web WebKit restores it.

outputs:
  cache-hit:
    description: The exact key was restored
    value: ${{ steps.cache.outputs.cache-hit }}
  key:
    description: The cache key for this Playwright version
    value: ${{ steps.version.outputs.key }}
  paths:
    description: The cached folders
    value: ${{ steps.version.outputs.paths }}

runs:
  using: composite
  steps:
    # Keyed on the installed Playwright version, which pins the browser
    # builds and the package list. A new version restores the previous entry,
    # so apt still finds most packages locally.
    - name: Resolve Playwright version
      id: version
      shell: bash
      run: |
        version="$(pnpm --filter web exec node -p "require('playwright/package.json').version")"
        echo "key=js-playwright-${RUNNER_OS}-${RUNNER_ARCH}-${version}" >> "$GITHUB_OUTPUT"
        {
          echo "paths<<EOF"
          echo "$HOME/.cache/ms-playwright"
          echo "$HOME/.cache/playwright-apt"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Restore Playwright cache
      id: cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.version.outputs.paths }}
        key: ${{ steps.version.outputs.key }}
        restore-keys: js-playwright-${{ runner.os }}-${{ runner.arch }}-

    # apt keeps every .deb it downloads in Dir::Cache::Archives. `partial/` is
    # where its `_apt` user downloads, so it must be writable by that user.
    - name: Keep apt packages in the cached folder
      shell: bash
      run: |
        mkdir -p "$HOME/.cache/playwright-apt/partial"
        chmod -R a+rwX "$HOME/.cache/playwright-apt"
        printf 'Dir::Cache::Archives "%s";\nAPT::Keep-Downloaded-Packages "true";\n' \
          "$HOME/.cache/playwright-apt" \
          | sudo tee /etc/apt/apt.conf.d/99-playwright-cache > /dev/null

    - name: Install Playwright browsers
      shell: bash
      run: pnpm --filter web exec playwright install --with-deps webkit chromium
