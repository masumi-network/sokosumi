name: Test (Web App)
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web-app
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sokosumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Dependencies
        run: npm install

      - name: Cache npm store
        uses: actions/cache@v4
        with:
          path: ~/.npm-store
          key: ${{ runner.os }}-npm-store-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-store-

      - name: Run Tests
        run: npm run test:ci

      - name: Run Prisma Migrate
        run: npm run prisma:migrate

      - name: Run Build
        run: npm run build
