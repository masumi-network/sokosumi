name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  # Lint on main after Apple merges so the Mint cache is saved on the default
  # branch. PR caches are scoped to refs/pull/N/merge and cannot be restored
  # by sibling PRs.
  push:
    branches:
      - main
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"

concurrency:
  # A new push to the same PR cancels the queued or running run for the old
  # commit. Runs on main are never cancelled so the cache saves complete.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Apple changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"
              - ".github/workflows/apple.yml"

  lint:
    name: Swift lint and format
    needs: changes
    # PR, dispatch, or path-filtered `push` to main so `actions/cache` saves
    # ~/.mint on the default branch. Tests moved to Xcode Cloud (one macOS
    # Test action on the `Sokosumi` workspace scheme, which runs the app tests
    # and all five package suites); Xcode Cloud has no lint action, so
    # SwiftLint and SwiftFormat stay here. `Swift lint and format` is a
    # required status check on `main`.
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27 toolchain
        # Image default is Xcode 27; Xcode.app is the documented alias.
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

      - name: Bootstrap pinned Swift tools
        working-directory: apps/apple
        run: mint bootstrap

      - name: Check Swift formatting
        working-directory: apps/apple
        run: mint run swiftformat --lint .

      - name: Lint Swift
        working-directory: apps/apple
        run: mint run swiftlint lint --strict
