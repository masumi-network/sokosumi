name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    name: Detect Apple changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"

  xcodebuild:
    name: Xcode build
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    # Packages declare `swift-tools-version: 6.2`, which needs Xcode 26 (macOS 26).
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Build Sokosumi for macOS
        # -skipPackagePluginValidation: no interactive user to trust the OpenAPIGenerator plugin in CI.
        run: xcodebuild -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation build
