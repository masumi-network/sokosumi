name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

jobs:
  changes:
    name: Detect Apple changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"

  xcodebuild:
    name: Xcode build
    needs: changes
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build Sokosumi for macOS
        run: xcodebuild -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' build
