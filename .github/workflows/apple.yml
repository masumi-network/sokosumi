name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  # Lint on main after Apple merges so the Mint cache is saved on the default
  # branch. PR caches are scoped to refs/pull/N/merge and cannot be restored
  # by sibling PRs.
  push:
    branches:
      - main
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"

jobs:
  changes:
    name: Detect Apple changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"
              - ".github/workflows/apple.yml"

  # Shared CI signing note: the project carries a developer team for local
  # runs, but CI holds no Apple certificates — so every xcodebuild invocation
  # below overrides it with ad-hoc signing (`DEVELOPMENT_TEAM=`
  # `CODE_SIGN_IDENTITY=-`, see SOK-973). `-skipPackagePluginValidation`: no
  # interactive user to trust the OpenAPIGenerator plugin in CI.
  build:
    name: Xcode build
    needs: changes
    # PR (Apple paths) or dispatch only. Skip `push` — main push exists to seed
    # the Mint cache via `lint` (PR caches are ref-scoped).
    if: (github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true') || github.event_name == 'workflow_dispatch'
    # Packages declare `swift-tools-version: 6.2`, which needs Xcode 26 (macOS 26).
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Build Sokosumi for macOS
        run: xcodebuild -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- build

  test-suite:
    name: ${{ matrix.name }}
    # Same PR/dispatch gate as `build` above (and as build.yml/test.yml
    # for the JS apps): build and test run in parallel, neither waits.
    needs: changes
    if: (github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true') || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Xcode app tests
            package: ""
          - name: Swift tests (SokosumiChat)
            package: SokosumiChat
          - name: Swift tests (SokosumiAuth)
            package: SokosumiAuth
          - name: Swift tests (CoreAPI)
            package: CoreAPI
          - name: Swift tests (SokosumiRealtime)
            package: SokosumiRealtime
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Test Sokosumi app target
        if: matrix.package == ''
        # Coverage stays off: ably-cocoa's C target (AblyDeltaCodec) cannot
        # link the profile runtime, so gathering coverage fails the test
        # build (SOK-976). Nothing consumes coverage today. Restore later by
        # excluding AblyDeltaCodec, not by re-enabling coverage on this job.
        run: xcodebuild test -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- -only-testing:SokosumiTests -enableCodeCoverage NO

      - name: Test Swift package
        if: matrix.package != ''
        env:
          PACKAGE: ${{ matrix.package }}
        run: swift test --package-path "apps/apple/Packages/$PACKAGE"

  # Preserve the existing check name and require every suite to pass.
  test:
    name: Xcode test
    needs: test-suite
    if: always() && needs.test-suite.result != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - name: Check all Apple test suites
        env:
          RESULT: ${{ needs.test-suite.result }}
        run: test "$RESULT" = success

  lint:
    name: Swift lint and format
    needs: changes
    # Same PR/dispatch gate as `build`/`test`, plus path-filtered `push` to
    # main so `actions/cache` saves ~/.mint on the default branch.
    if: needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

      - name: Bootstrap pinned Swift tools
        working-directory: apps/apple
        run: mint bootstrap

      - name: Check Swift formatting
        working-directory: apps/apple
        run: mint run swiftformat --lint .

      - name: Lint Swift
        working-directory: apps/apple
        run: mint run swiftlint lint --strict
