name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
    # `ready_for_review` is not in the default pull_request types: without it,
    # marking a draft ready would not trigger this workflow at all.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  changes:
    name: Detect Apple changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"
              - ".github/workflows/apple.yml"

  # Shared CI signing note: the project carries a developer team for local
  # runs, but CI holds no Apple certificates — so every xcodebuild invocation
  # below overrides it with ad-hoc signing (`DEVELOPMENT_TEAM=`
  # `CODE_SIGN_IDENTITY=-`, see SOK-973). `-skipPackagePluginValidation`: no
  # interactive user to trust the OpenAPIGenerator plugin in CI.
  build:
    name: Xcode build
    needs: changes
    # Draft PRs skip Apple CI: runners only spin up once the PR is marked
    # ready (or on manual dispatch, which carries no pull_request payload).
    if: (needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    # Packages declare `swift-tools-version: 6.2`, which needs Xcode 26 (macOS 26).
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Build Sokosumi for macOS
        run: xcodebuild -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- build

  test:
    name: Xcode test
    # Same gate as `build` above (and as build.yml/test.yml for the JS
    # apps): build and test run in parallel, neither waits for the other.
    needs: changes
    if: (needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Test Sokosumi app target
        run: xcodebuild test -project apps/apple/Sokosumi.xcodeproj -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- -only-testing:SokosumiTests

      - name: Test Swift packages
        run: |
          for package in apps/apple/Packages/SokosumiChat apps/apple/Packages/SokosumiAuth; do
            swift test --package-path "$package"
          done

  lint:
    name: Swift lint and format
    needs: changes
    # Same gate as `build`/`test` above: ready-for-review PRs (or manual
    # dispatch) touching apps/apple/**.
    if: (needs.changes.outputs.apple == 'true' || github.event_name == 'workflow_dispatch') && (github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false)
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 26 toolchain
        # Newest installed Xcode 26.x; stays on major 26 (Swift >= 6.2) across image updates.
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)/Contents/Developer"

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Install Mint
        run: brew install mint

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

      - name: Bootstrap pinned Swift tools
        working-directory: apps/apple
        run: mint bootstrap

      - name: Check Swift formatting
        working-directory: apps/apple
        run: mint run swiftformat --lint .

      - name: Lint Swift
        working-directory: apps/apple
        run: mint run swiftlint lint --strict
