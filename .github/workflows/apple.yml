name: Apple
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  # Main-scoped caches (Mint, SwiftPM, Xcode compilation) are what PRs restore.
  # Saving them used to mean running test/lint on every Apple push to main.
  # A daily off-peak warm plus manual dispatch fills the same keys instead.
  schedule:
    - cron: "17 3 * * *"
  # Push still starts the workflow so Publish macOS DMG runs on every Apple
  # merge. Test and lint do not run on this event.
  push:
    branches:
      - main
    paths:
      - "apps/apple/**"
      - ".github/workflows/apple.yml"

concurrency:
  # A new push to the same PR cancels the queued or running run for the old
  # commit. Runs on main are never cancelled so the cache saves complete.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Apple changes
    # Schedule has no push/PR diff; skip rather than fail paths-filter.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.filter.outputs.apple }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Detect Apple-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            apple:
              - "apps/apple/**"
              - ".github/workflows/apple.yml"

  # CI signing note: the project carries a developer team for local runs, but
  # CI holds no Apple certificates, so xcodebuild overrides it with ad-hoc
  # signing (`DEVELOPMENT_TEAM=` `CODE_SIGN_IDENTITY=-`, see SOK-973).
  # `-skipPackagePluginValidation`: no interactive user to trust the
  # OpenAPIGenerator plugin in CI.
  #
  # There is no separate build job: `xcodebuild build-for-testing` builds the
  # same scheme, configuration and destination before the tests run.
  test:
    name: Xcode test
    needs: changes
    # Required check name: keep this `name:` stable. Runs on pull_request
    # only (path-filtered by `changes`). A skipped job still reports, so
    # non-Apple PRs satisfy the Default Branch ruleset. Do not run on push
    # to main: that queued macOS runners behind every Apple merge.
    #
    # One build of the `Sokosumi` *workspace* scheme covers the app target
    # and all five package suites -- the workspace is what makes the package
    # tests reachable from the scheme, so do not add per-package jobs. Its
    # tests are what `xcodebuild test`, the command `apps/apple/README.md`
    # tells a human to run, runs; CI only spreads them over processes.
    #
    # Xcode Cloud builds releases only; it never reports on a pull request, so
    # this job is the Apple test gate. See
    # `apps/apple/docs/xcode-cloud-required-check.md`.
    if: github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27 toolchain
        # Image default is Xcode 27; Xcode.app is the documented alias.
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      # SwiftPM otherwise clones every dependency (tree-sitter grammars,
      # ably-cocoa, swift-openapi, ...) from GitHub on each run, ~1m40s of
      # the test step. Keyed by the workspace's pins, so a version bump
      # fetches afresh. `-skipPackageUpdates` stops xcodebuild re-fetching
      # every remote (~40s) when the restored checkouts already match.
      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/apple/Sokosumi.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Xcode's compilation cache is keyed by the compiler's inputs, not by
      # file dates, so unlike DerivedData it survives a fresh checkout: an
      # unchanged module replays instead of compiling. Any earlier entry is
      # a valid starting point, hence the run-scoped key and prefix restore.
      # swift-build deletes that directory after the build unless
      # COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES (cleanupCompilationCache).
      - name: Restore Xcode compilation cache
        id: cas-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ runner.os }}-xcode-cas-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-xcode-cas-

      - name: Build Sokosumi workspace scheme for testing
        working-directory: apps/apple
        # Coverage stays off: ably-cocoa's C target (AblyDeltaCodec) cannot
        # link the profile runtime, so gathering coverage fails the test build
        # (SOK-976). Nothing consumes coverage today. Restore later by
        # excluding AblyDeltaCodec, not by re-enabling coverage here.
        run: xcodebuild -workspace Sokosumi.xcworkspace -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipPackageUpdates -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache" COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES build-for-testing -enableCodeCoverage NO -resultBundlePath "$RUNNER_TEMP/Sokosumi.xcresult"

      # Swift Testing runs a whole test target in one app-host process, and
      # `@Suite(.serialized) NativeWindowTests` (shared NSApplication window
      # state and URLProtocol registration) runs its ~300s of window tests one
      # after another there: the job's critical path. Separate processes each
      # own those, so three run at once, one per runner core: the
      # NativeWindowTests suites split in two by measured time, and
      # everything else. A fourth process (three window shards) starved the
      # package tests until a 30s optimistic-read expiry fired mid-test, and
      # saved 11s.
      # The second shard takes every suite the first does not list, so a new
      # or renamed suite still runs. Move suites to `first` to rebalance.
      - name: Test Sokosumi workspace scheme
        run: |
          first=(RoomHeaderTests ThreadParentMarkTests JumpSpotlightViewTests JumpMarkViewTests ChatCopyAlignmentTests TranscriptContentGrowthTests HistoryGapRowTests SidebarThreadRowsViewTests SidebarRoomAttentionTests ThreadPaginationTests MessageEditComposerChromeTests)
          window=SokosumiTests/NativeWindowTests
          # The default DerivedData path: the compilation cache keys include it.
          xctestrun=$(echo ~/Library/Developer/Xcode/DerivedData/Sokosumi-*/Build/Products/*.xctestrun)
          shards="$RUNNER_TEMP/shards"
          mkdir -p "$shards"
          run() {
            xcodebuild test-without-building -xctestrun "$xctestrun" -destination 'platform=macOS,arch=arm64' -enableCodeCoverage NO -resultBundlePath "$shards/$1.xcresult" "${@:2}" > "$shards/$1.log" 2>&1
          }
          run window-1 "${first[@]/#/-only-testing:$window/}" & pids=($!)
          run window-2 "-only-testing:$window" "${first[@]/#/-skip-testing:$window/}" & pids+=($!)
          run rest "-skip-testing:$window" & pids+=($!)
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          for log in "$shards"/*.log; do
            echo "::group::$(basename "$log" .log)"
            cat "$log"
            echo "::endgroup::"
          done
          if [ "$status" -ne 0 ]; then
            rm -rf "$RUNNER_TEMP/Sokosumi.xcresult"
            xcrun xcresulttool merge "$shards"/*.xcresult --output-path "$RUNNER_TEMP/Sokosumi.xcresult"
          fi
          exit "$status"

      - name: Report test failures
        if: failure()
        run: |
          if [ -d "$RUNNER_TEMP/Sokosumi.xcresult" ]; then
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/Sokosumi.xcresult"
          fi

      - name: Preserve failed test results
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sokosumi-xcresult
          path: ${{ runner.temp }}/Sokosumi.xcresult
          retention-days: 3
          if-no-files-found: ignore

  lint:
    name: Swift lint and format
    needs: changes
    # Required check name: keep this `name:` stable. Same PR-only gate as
    # `Xcode test`. Mint on main is saved by `Warm Apple caches`, not here.
    if: github.event_name == 'pull_request' && needs.changes.outputs.apple == 'true'
    runs-on: xcode-27
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27 toolchain
        # Image default is Xcode 27; Xcode.app is the documented alias.
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Install Mint
        run: brew install mint

      - name: Test scrolling performance runner
        run: python3 apps/apple/scripts/test-scrolling-performance.py

      - name: Cache Mint packages
        uses: actions/cache@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

      - name: Bootstrap pinned Swift tools
        working-directory: apps/apple
        run: mint bootstrap

      - name: Check Swift formatting
        working-directory: apps/apple
        run: mint run swiftformat --lint .

      - name: Lint Swift
        working-directory: apps/apple
        run: mint run swiftlint lint --strict

  # Main-scoped caches PRs restore: SwiftPM checkouts, Xcode compilation CAS,
  # and Mint. build-for-testing fills the first two (the test step does not
  # write them). mint bootstrap fills ~/.mint. No DerivedData save: that
  # directory is date-keyed and the CAS already covers compile replay.
  warm:
    name: Warm Apple caches
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27 toolchain
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version && swift --version

      - name: Restore Swift package checkouts
        id: spm-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/apple/Sokosumi.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Restore Xcode compilation cache
        id: cas-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ runner.os }}-xcode-cas-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-xcode-cas-

      - name: Build Sokosumi workspace scheme for testing
        working-directory: apps/apple
        run: xcodebuild -workspace Sokosumi.xcworkspace -scheme Sokosumi -configuration Debug -destination 'platform=macOS,arch=arm64' -skipPackagePluginValidation -skipPackageUpdates -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" DEVELOPMENT_TEAM= CODE_SIGN_IDENTITY=- COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH="$RUNNER_TEMP/CompilationCache" COMPILATION_CACHE_KEEP_CAS_DIRECTORY=YES build-for-testing -enableCodeCoverage NO -resultBundlePath "$RUNNER_TEMP/Sokosumi.xcresult"

      - name: Save Swift package checkouts
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.spm-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('apps/apple/Sokosumi.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Save Xcode compilation cache
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cas-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: ${{ runner.os }}-xcode-cas-${{ github.run_id }}

      - name: Delete superseded Xcode compilation caches
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.cas-cache.outputs.cache-hit != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh cache list --ref "$GITHUB_REF" --key "$RUNNER_OS-xcode-cas-" --sort created_at
          --order desc --limit 100 --json id --jq '.[1:][].id'
          | xargs -r -n1 gh cache delete

      - name: Install Mint
        run: brew install mint

      - name: Restore Mint packages
        id: mint-cache
        uses: actions/cache/restore@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

      - name: Bootstrap pinned Swift tools
        working-directory: apps/apple
        run: mint bootstrap

      - name: Save Mint packages
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' && steps.mint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v6
        with:
          path: ~/.mint
          key: ${{ runner.os }}-mint-${{ hashFiles('apps/apple/Mintfile') }}

  # The rolling download. Every Apple change that reaches main replaces the
  # single `apple-latest` prerelease, so
  # https://github.com/masumi-network/sokosumi/releases/download/apple-latest/Sokosumi.dmg
  # is a permanent link to the newest build.
  #
  # No `needs: test`: `Xcode test` is pull_request-only, and a skipped needed
  # job skips its dependents. The Default Branch ruleset already required
  # `Xcode test` on the PR that merged. Do not add `needs: warm` (or `test`)
  # — warm's `if` is false on push, so that need would skip Publish on every
  # Apple main push. `changes` does run on push; it is not the skip cause.
  #
  # Deliberately NOT gated on `lint`. SwiftLint and SwiftFormat are style
  # checks and cannot make a binary broken, so withholding a working,
  # notarized download over indentation is a false coupling.
  #
  # The app is sandboxed with the hardened runtime on, so it must be signed
  # with a Developer ID Application certificate and notarized by Apple, or
  # Gatekeeper refuses it on every machine that did not build it. All six
  # secrets below are set by `apps/apple/scripts/setup-release-signing.sh`.
  publish:
    name: Publish macOS DMG
    # `workflow_dispatch` still builds, notarizes and uploads the artifact
    # without rewriting `apple-latest`. That is the way to test a change to
    # this job. Schedule does not match, so the daily warm never publishes.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    permissions:
      # `gh release` rewrites the apple-latest tag and its assets.
      contents: write
    env:
      TEAM_ID: GVWN7HXYJB
      RELEASE_TAG: apple-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode 27 toolchain
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.APPLE_DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERT_PASSWORD }}
        # A throwaway keychain, unlocked for this job only. The runner is
        # ephemeral, but an explicit keychain keeps the key out of the login
        # keychain and lets `security set-key-partition-list` grant codesign
        # non-interactive access -- without it codesign blocks on a UI prompt
        # no CI machine can answer.
        run: |
          KEYCHAIN_PASSWORD="$(uuidgen)"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN_PATH" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" > /dev/null
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Install the Developer ID provisioning profile
        env:
          PROFILE: ${{ secrets.APPLE_DEVELOPER_ID_PROFILE }}
        # The app signs in through an HTTPS callback, which needs the
        # Associated Domains entitlement. That entitlement is restricted: a
        # Developer ID signature carries it only with a provisioning profile
        # that grants it, and macOS kills the app at launch otherwise. The
        # profile's own name is read out here, so renaming it in the developer
        # portal needs no change in this file.
        run: |
          if [ -z "$PROFILE" ]; then
            echo "::error::APPLE_DEVELOPER_ID_PROFILE is not set. Run apps/apple/scripts/setup-release-signing.sh."
            exit 1
          fi
          PROFILE_PATH="$RUNNER_TEMP/sokosumi.provisionprofile"
          echo "$PROFILE" | base64 --decode > "$PROFILE_PATH"
          security cms -D -i "$PROFILE_PATH" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          PROFILE_NAME="$(/usr/libexec/PlistBuddy -c 'Print :Name' "$RUNNER_TEMP/profile.plist")"
          # Xcode 16 moved the folder; older tools still read the first one.
          for directory in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$directory"
            cp "$PROFILE_PATH" "$directory/$PROFILE_UUID.provisionprofile"
          done
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$PROFILE_PATH" "$RUNNER_TEMP/profile.plist"

      - name: Archive Sokosumi for Developer ID
        working-directory: apps/apple
        # CFBundleVersion must rise for every published build. The run number
        # is monotonic per workflow, which is exactly that guarantee. Core
        # compares it with MACOS_DEVELOPER_ID_MINIMUM_BUILD, so the channel
        # must say developer-id (ADR 0053); Xcode Cloud keeps app-store.
        #
        # `SOKOSUMI_PROVISIONING_PROFILE`, not `PROVISIONING_PROFILE_SPECIFIER`:
        # a setting on the command line reaches every target, and the Swift
        # package targets reject a profile. The project hands this one to the
        # app target only.
        run: |
          xcodebuild -workspace Sokosumi.xcworkspace -scheme Sokosumi \
            -configuration Release -destination 'platform=macOS,arch=arm64' \
            -skipPackagePluginValidation -archivePath "$RUNNER_TEMP/Sokosumi.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            SOKOSUMI_PROVISIONING_PROFILE="$PROFILE_NAME" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            SOKOSUMI_DISTRIBUTION_CHANNEL=developer-id \
            archive

      - name: Export a Developer ID app
        working-directory: apps/apple
        run: |
          cp ExportOptions.plist "$RUNNER_TEMP/ExportOptions.plist"
          /usr/libexec/PlistBuddy \
            -c "Add :provisioningProfiles dict" \
            -c "Add :provisioningProfiles:com.sokosumi.app string $PROFILE_NAME" \
            "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Sokosumi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Check the exported app can take the sign-in callback
        # Without this entitlement in the signature the app builds, notarizes
        # and opens, and then cannot sign in.
        run: |
          codesign -d --entitlements - --xml "$RUNNER_TEMP/export/Sokosumi.app" \
            | grep -q 'webcredentials:app.sokosumi.com'

      - name: Build the disk image
        working-directory: apps/apple
        # dmgbuild, not a hand-rolled `diskutil image create from`. The look of
        # a disk image lives in files inside the volume -- `.DS_Store` (window
        # size, icon positions, view mode), `.background.tiff` and
        # `.VolumeIcon.icns` -- and `diskutil image create from` STRIPS
        # `.DS_Store` when it packages a folder, so a styled image is
        # impossible that way. Verified, not assumed.
        #
        # dmgbuild writes `.DS_Store` through the ds_store and mac_alias
        # modules rather than driving Finder with AppleScript, which is what
        # makes it work on a headless runner. It does shell out to `hdiutil`
        # internally, so expect that tool's deprecation warnings in this log;
        # they come from dmgbuild, not from us.
        #
        # Layout, icon and ULFO compression are all in `dmg-settings.py`.
        run: |
          rm -f "$RUNNER_TEMP/Sokosumi.dmg"
          python3 -m venv "$RUNNER_TEMP/dmgenv"
          "$RUNNER_TEMP/dmgenv/bin/pip" install --quiet dmgbuild==1.6.7
          "$RUNNER_TEMP/dmgenv/bin/dmgbuild" \
            -s dmg-settings.py \
            -D app="$RUNNER_TEMP/export/Sokosumi.app" \
            Sokosumi "$RUNNER_TEMP/Sokosumi.dmg"

      - name: Notarize and staple
        env:
          NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        # Notarizing the disk image covers the app inside it. `--wait` blocks
        # until Apple answers, so a rejection fails the job here rather than
        # shipping a build Gatekeeper will refuse. Stapling writes the ticket
        # into the image so it opens without a network round trip.
        run: |
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool submit "$RUNNER_TEMP/Sokosumi.dmg" \
            --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" \
            --issuer "$NOTARY_ISSUER_ID" \
            --wait
          rm -f "$RUNNER_TEMP/notary.p8"
          xcrun stapler staple "$RUNNER_TEMP/Sokosumi.dmg"
          xcrun stapler validate "$RUNNER_TEMP/Sokosumi.dmg"

      - name: Upload the disk image as a run artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: Sokosumi-dmg
          path: ${{ runner.temp }}/Sokosumi.dmg
          # Short: the current build always lives at the apple-latest URL, so
          # this exists to grab one specific run, not to archive history.
          retention-days: 7
          if-no-files-found: error

      - name: Replace the apple-latest prerelease
        # Never on a manual run: a test build must not rewrite the link people
        # have already been given.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        # One tag, rewritten each time, so the download URL never changes.
        # `--clobber` replaces the asset in place; recreating the release
        # would hand out a new URL and break every link already shared.
        run: |
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --target "$GITHUB_SHA" \
              --notes "Newest macOS build from \`main\` ($GITHUB_SHA). Signed and notarized. Not a stable release."
            # `--target` moves only targetCommitish; an existing tag stays
            # where it was created, so move it to this build explicitly.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/$RELEASE_TAG" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create "$RELEASE_TAG" --prerelease --target "$GITHUB_SHA" \
              --title "Sokosumi for macOS (latest)" \
              --notes "Newest macOS build from \`main\` ($GITHUB_SHA). Signed and notarized. Not a stable release."
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/Sokosumi.dmg" --clobber
