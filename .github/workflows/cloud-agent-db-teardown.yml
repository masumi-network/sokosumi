name: Cloud agent database teardown

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      agent_id:
        description: Cloud agent run id (bc-…)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  teardown:
    name: Tear down agent Neon branch
    # Same-repo only: pull_request_target would otherwise pass NEON secrets to
    # fork close events. Cloud agent PRs are always same-repo.
    # `--from-text` only tears down `bc-…` ids found in the body, so a PR
    # without one skips here instead of paying a runner to find nothing.
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.body, 'bc-'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Privileged (NEON_API_KEY). Default branch only — never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Teardown from closed pull request
        if: ${{ github.event_name == 'pull_request_target' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/cloud-agent-db/teardown.mjs --from-text "$PR_BODY"

      - name: Teardown explicit agent id
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
          AGENT_ID: ${{ inputs.agent_id }}
        run: node scripts/cloud-agent-db/teardown.mjs --agent-id "$AGENT_ID"
