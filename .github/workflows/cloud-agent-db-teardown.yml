name: Cloud agent database teardown

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      agent_id:
        description: Cloud agent run id (bc-…)
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

jobs:
  teardown:
    name: Tear down agent Neon branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Teardown from closed pull request
        if: ${{ github.event_name == 'pull_request' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/cloud-agent-db/teardown.mjs --from-text "$PR_BODY"

      - name: Teardown explicit agent id
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.agent_id != '' }}
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}
          NEON_PARENT_BRANCH: ${{ vars.NEON_PARENT_BRANCH }}
          # Never interpolate `inputs.*` directly into `run:` — GitHub expands it
          # into shell source before the shell parses quotes. Pass via env, same
          # as the PR_BODY step above.
          AGENT_ID: ${{ inputs.agent_id }}
        run: node scripts/cloud-agent-db/teardown.mjs --agent-id "$AGENT_ID"
