name: Linting
on:
  pull_request:

concurrency:
  # A new push to the same PR cancels the queued or running run for the old commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  changes:
    name: Detect JS changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect JS-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 'every' is required: with the default 'some', the '!' exclusion
          # patterns in js-paths-filter.yml would not exclude anything.
          predicate-quantifier: "every"
          filters: .github/js-paths-filter.yml

  biome:
    name: Biome
    needs: changes
    # No job-level `if:` here on purpose: `Biome` is a required check.
    # Gating is per-step below, so docs-only PRs report a fast success
    # instead of a skip that never satisfies the ruleset.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.js == 'true'
        uses: ./.github/actions/setup

      - name: Run Biome checks
        if: needs.changes.outputs.js == 'true'
        run: pnpm check

  typecheck:
    name: Typecheck
    needs: changes
    # No job-level `if:` here on purpose: `Typecheck` is a required check.
    # Gating is per-step below, so docs-only PRs report a fast success
    # instead of a skip that never satisfies the ruleset.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs.js == 'true'
        uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      - name: Run TypeScript typecheck
        if: needs.changes.outputs.js == 'true'
        run: pnpm typecheck
