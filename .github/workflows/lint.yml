name: Linting
on:
  pull_request:

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  eslint:
    name: ESLint
    runs-on: ubuntu-latest
    permissions:
      # Need to add these 2 for eslint-annotate-action
      pull-requests: read
      checks: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Generate ESLint JSON reports
        run: pnpm lint:report
        continue-on-error: true

      - name: Annotate web lint results
        if: always()
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: "apps/web/lint-report.json"

      - name: Annotate core lint results
        if: always()
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: "apps/core/lint-report.json"

      - name: Annotate database lint results
        if: always()
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: "packages/database/lint-report.json"

      - name: Annotate masumi lint results
        if: always()
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: "packages/masumi/lint-report.json"

      - name: Annotate chat lint results
        if: always()
        continue-on-error: true
        uses: ataylorme/eslint-annotate-action@v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          report-json: "packages/chat/lint-report.json"

      - name: Run lint checks
        run: pnpm lint
