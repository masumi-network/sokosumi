name: Next build cache
permissions:
  contents: read

# The only writer of the js-next-* cache that ci.yml's Build restores. A
# PR's cache is scoped to refs/pull/N/merge and no other PR can read it; a
# cache saved on main is readable by every PR. So Build only restores, and
# this job saves web's Turbopack build cache from the newest main commit.
# Superseded entries are deleted after each save, so there is one ~0.5 GB
# copy: it cannot fill the repo's 10 GB and evict Apple's macOS-mint-*.
# It also saves the ffmpeg binary Test Core restores (js-ffmpeg-static-*),
# so CI does not download it from GitHub Releases on every run.
on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/**"
      - ".nvmrc"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - ".github/ci-build.env"
      - ".github/actions/setup/action.yml"
      - ".github/workflows/next-build-cache.yml"
  # Entries nobody reads for 7 days are evicted. A restore counts as a read,
  # so the daily run keeps it alive through a week without PRs.
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Same placeholder as ci.yml, so turbo hashes and Next compiles alike.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  warm:
    name: Warm Next build cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Turborepo remote cache (OIDC).
      id-token: write
      # Delete superseded cache entries.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      - name: Load build env
        run: grep -v '^#' .github/ci-build.env >> "$GITHUB_ENV"

      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: js-next-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: js-next-${{ runner.os }}-${{ runner.arch }}-

      # --force: a remote-cache hit replays web#build without running
      # `next build`, which would save the restored cache unchanged.
      - name: Build web
        if: steps.next-cache.outputs.cache-hit != 'true'
        run: pnpm exec turbo run build --filter=web --force

      - name: Save Next.js build cache
        if: steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: apps/web/.next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}

      - name: Delete superseded Next build caches
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh cache list --ref "$GITHUB_REF" --key js-next- --sort created_at
          --order desc --limit 100 --json id --jq '.[1:][].id'
          | xargs -r -n1 gh cache delete

  # One ~80 MB entry per ffmpeg-static version. The daily run restores it,
  # which keeps it from being evicted.
  ffmpeg:
    name: Warm ffmpeg cache
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Delete superseded cache entries.
      actions: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # On a miss, Setup installs ffmpeg-static as before, which downloads
      # the binary.
      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          ffmpeg: "true"

      - name: Copy the installed binary
        if: steps.setup.outputs.ffmpeg-cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/sokosumi
          cp -L "$(node -p "require('./apps/core/node_modules/ffmpeg-static')")" ~/.cache/sokosumi/ffmpeg
          ~/.cache/sokosumi/ffmpeg -version | head -1

      - name: Save the ffmpeg binary
        if: steps.setup.outputs.ffmpeg-cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/sokosumi/ffmpeg
          key: ${{ steps.setup.outputs.ffmpeg-cache-key }}

      - name: Delete superseded ffmpeg caches
        if: steps.setup.outputs.ffmpeg-cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh cache list --ref "$GITHUB_REF" --key js-ffmpeg-static- --sort created_at
          --order desc --limit 100 --json id --jq '.[1:][].id'
          | xargs -r -n1 gh cache delete
