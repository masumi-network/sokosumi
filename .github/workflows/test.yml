name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

env:
  # Tests mock their dependencies and inject their own env defaults, so a
  # placeholder is enough for any config that reads DATABASE_URL at import time.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  changes:
    name: Detect JS changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect JS-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 'every' is required: with the default 'some', the '!' exclusion
          # patterns below would not exclude anything.
          predicate-quantifier: "every"
          filters: |
            js:
              - "**"
              - "!apps/apple/**"
              - "!docs/**"
              - "!**/*.md"

  test:
    name: Test ${{ matrix.target.name }}
    needs: changes
    if: needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: Web, command: "pnpm exec turbo run test:ci --filter=web" }
          - { name: Core, command: "pnpm exec turbo run test:ci --filter=@sokosumi/core" }
          - { name: Packages, command: 'pnpm exec turbo run test:ci --filter="./packages/*"' }
          - { name: Local env, command: "pnpm local-env:test" }
          - { name: CI config, command: "pnpm ci:test" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      - name: Run Tests
        run: ${{ matrix.target.command }}
