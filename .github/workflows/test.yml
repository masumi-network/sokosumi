name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

env:
  # Tests mock their dependencies and inject their own env defaults, so a
  # placeholder is enough for any config that reads DATABASE_URL at import time.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  test:
    name: Test ${{ matrix.target.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - { name: Web, command: "pnpm web:test:ci" }
          - { name: Core, command: "pnpm core:test:ci" }
          - { name: Packages, command: 'pnpm --filter "./packages/*" test:ci' }
          - { name: Local env, command: "pnpm local-env:test" }
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        uses: ./.github/actions/setup

      - name: Run Tests
        run: ${{ matrix.target.command }}
