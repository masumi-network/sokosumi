name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

env:
  # Tests mock their dependencies and inject their own env defaults, so a
  # placeholder is enough for any config that reads DATABASE_URL at import time.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Web Tests
        run: pnpm web:test:ci

  core:
    name: Core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Core Tests
        run: pnpm core:test:ci

  packages:
    name: Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Package Tests
        run: pnpm --filter "./packages/*" test:ci
