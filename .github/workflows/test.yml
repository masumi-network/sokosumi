name: Tests
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

concurrency:
  # A new push to the same PR cancels the queued or running run for the old commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Tests mock their dependencies and inject their own env defaults, so a
  # placeholder is enough for any config that reads DATABASE_URL at import time.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

jobs:
  changes:
    name: Detect JS changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      js: ${{ steps.filter.outputs.js }}
      docs: ${{ steps.filter.outputs.docs }}
      cli: ${{ steps.filter.outputs.cli }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect JS-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 'every' is required: with the default 'some', the '!' exclusion
          # patterns in js-paths-filter.yml would not exclude anything.
          predicate-quantifier: "every"
          filters: .github/js-paths-filter.yml

  test:
    name: Test ${{ matrix.target.name }}
    needs: changes
    # No job-level `if:` here on purpose: the matrix must expand so each
    # leg reports under its real name (Test Web / Test Core / Test
    # Packages), which the branch ruleset requires. Gating is per-step
    # below, so docs-only PRs report fast successes instead of one
    # `Test ${{ matrix.target.name }}` skip placeholder that satisfies
    # none of the required contexts. Test CLI, Test Local env, Test CI
    # config, and Test Cloud agent db share this matrix but are
    # advisory — not merge gates. See docs/agents/delivery.md. Test CI
    # config still runs on markdown-only PRs (doc-script check), and
    # Test CLI runs only on apps/cli changes (see matrix `filter`).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # `filter` names the path-filter output this leg gates on (see
        # .github/js-paths-filter.yml). CLI is the one leg with no
        # workspace dependencies, so it gates on apps/cli alone.
        target:
          - { name: Web, command: "pnpm exec turbo run test:ci --filter=web", filter: js }
          - { name: Core, command: "pnpm exec turbo run test:ci --filter=@sokosumi/core", filter: js }
          - { name: CLI, command: "pnpm exec turbo run test:ci --filter=./apps/cli", filter: cli }
          - { name: Packages, command: 'pnpm exec turbo run test:ci --filter="./packages/*"', filter: js }
          - { name: Local env, command: "pnpm local-env:test", filter: js }
          - { name: CI config, command: "pnpm ci:test", filter: js }
          - { name: Cloud agent db, command: "pnpm cloud-agent-db:test", filter: js }
    services:
      postgres:
        image: ${{ (matrix.target.name == 'Packages' || matrix.target.name == 'Core') && 'postgres:17' || '' }}
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: job_sync_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup
        if: needs.changes.outputs[matrix.target.filter] == 'true' || (matrix.target.name == 'CI config' && needs.changes.outputs.docs == 'true') || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      - name: Run Tests
        if: needs.changes.outputs[matrix.target.filter] == 'true' || (matrix.target.name == 'CI config' && needs.changes.outputs.docs == 'true') || github.event_name == 'workflow_dispatch'
        run: ${{ matrix.target.command }}

      # apps/cli is excluded from the `js` filter, so Typecheck, Biome and
      # Build all skip on a CLI-only PR. These three steps carry that
      # coverage instead — without them the CLI would merge on `tsx --test`
      # alone, which strips types rather than checking them.
      - name: Typecheck the CLI
        if: matrix.target.name == 'CLI' && (needs.changes.outputs.cli == 'true' || github.event_name == 'workflow_dispatch')
        run: pnpm --filter ./apps/cli typecheck

      - name: Lint the CLI
        if: matrix.target.name == 'CLI' && (needs.changes.outputs.cli == 'true' || github.event_name == 'workflow_dispatch')
        run: pnpm exec biome check apps/cli

      # Build and launch the compiled binary: the Build job never runs it, and
      # skips it outright on a CLI-only PR, while the CLI test suite exercises
      # source via tsx rather than dist.
      - name: Smoke the built CLI
        if: matrix.target.name == 'CLI' && (needs.changes.outputs.cli == 'true' || github.event_name == 'workflow_dispatch')
        run: |
          pnpm --filter ./apps/cli build
          node apps/cli/dist/bin/sokosumi.js --version

      - name: Test job sync against PostgreSQL
        if: matrix.target.name == 'Packages' && (needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch')
        env:
          JOB_SYNC_TEST_DATABASE_URL: "postgresql://user:password@localhost:5432/job_sync_test"
        run: pnpm --filter @sokosumi/database exec vitest run src/helpers/job-sync.postgres.test.ts

      # Exercise the real route against the schema Prisma deploys, not table
      # definitions copied into a fixture (which can hide identifier drift).
      - name: Test Projects API against PostgreSQL
        if: matrix.target.name == 'Core' && (needs.changes.outputs.js == 'true' || github.event_name == 'workflow_dispatch')
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/job_sync_test"
          DATABASE_URL_UNPOOLED: "postgresql://user:password@localhost:5432/job_sync_test"
        run: |
          pnpm --filter @sokosumi/database exec prisma db push
          RUN_DATABASE_INTEGRATION_TESTS=true pnpm --filter core test src/routes/v1/projects/get.postgres.test.ts src/helpers/project-activity.postgres.test.ts
