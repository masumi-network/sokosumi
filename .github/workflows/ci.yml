name: CI
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:

concurrency:
  # A new push to the same PR cancels the queued or running run for the old commit.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Tests mock their dependencies and inject their own env defaults, so a
  # placeholder is enough for any config that reads DATABASE_URL at import time.
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"

# Build, Biome, Typecheck and the Tests legs share one workflow so a push
# pays for one `Detect JS changes` runner instead of three.
#
# One job per leg, each gated by a job-level `if:` on its own path filter.
# A job skipped by `if:` never gets a runner, yet still reports its check
# under its real name (`Test Web`, …), and the ruleset accepts a skipped
# check — Apple's required `Xcode test` merges skipped on every JS PR. A
# matrix could not do this: it expands after the job-level `if:`, so a
# skipped matrix reports one `Test ${{ matrix.target.name }}` placeholder.
#
# Each gate is `!= 'false'` rather than `== 'true'`: when `changes` fails,
# its outputs are empty and every leg runs instead of skipping silently.
# `!cancelled()` stops a superseded run from starting legs.
jobs:
  changes:
    name: Detect JS changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    # workflow_dispatch has no PR diff, so it runs every leg.
    outputs:
      js: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.js }}
      web: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.web }}
      core: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.core }}
      packages: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.packages }}
      cli: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cli }}
      local-env: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.local-env }}
      cloud-agent-db: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.cloud-agent-db }}
      design-md: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.design-md }}
      # Markdown-only PRs still run the doc-script check.
      ci-config: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.ci-config }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Detect JS-relevant changes
        id: filter
        uses: dorny/paths-filter@v3
        with:
          # 'every' is required: with the default 'some', the '!' exclusion
          # patterns in js-paths-filter.yml would not exclude anything. The
          # advisory filters are brace lists, one pattern each, for the
          # same reason.
          predicate-quantifier: "every"
          filters: .github/js-paths-filter.yml

  # Web's suite is ~1000 files and ran 5+ minutes on one runner, the longest
  # leg by far, so it runs as three Vitest shards. A matrix is fine here
  # because nothing requires these checks: `web` below carries the required
  # `Test Web` name and reports skipped when the shards skip.
  web-shard:
    name: Test Web (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    # id-token lets Setup exchange OIDC for the Turborepo remote cache.
    permissions: &turbo-permissions
      contents: read
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7

      - &setup
        name: Setup
        uses: ./.github/actions/setup
        with:
          turbo_team: ${{ vars.TURBO_TEAM }}

      # Exactly what `test:ci`'s `^build` builds for web and cmo, through
      # turbo so it replays from the remote cache. `turbo run test:ci --
      # --shard=…` would instead change every task's hash, dependencies
      # included, and rebuild them on each shard.
      - name: Build test dependencies
        run: pnpm exec turbo run build --filter='web^...' --filter='cmo^...'

      # CMO rides this leg: a small Next.js app, too small for a job of
      # its own. pnpm appends `--shard` to both `test:ci` scripts, so CMO's
      # files spread across the shards too.
      - name: Run Tests
        run: pnpm --filter=web --filter=cmo run test:ci --shard=${{ matrix.shard }}/3

  web:
    name: Test Web
    needs: [changes, web-shard]
    if: ${{ !cancelled() && needs.changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard passed
        run: test "${{ needs.web-shard.result }}" = success

  # Core's unit suite ran 7+ minutes on one runner, so it shards like web.
  # The PostgreSQL work runs beside the shards in `core-db`, and `core`
  # below carries the required `Test Core` name.
  core-shard:
    name: Test Core (${{ matrix.shard }}/3)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      # Same split as the web shards: turbo builds what `test:ci`'s `^build`
      # would, from the remote cache, and pnpm runs the shard.
      - &core-test-deps
        name: Build test dependencies
        run: pnpm exec turbo run build --filter='@sokosumi/core^...'

      - name: Run Tests
        run: pnpm --filter=@sokosumi/core run test:ci --shard=${{ matrix.shard }}/3

  core-db:
    name: Test Core PostgreSQL
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      # A plain background container, not a `services:` entry: services
      # block the first step for ~23s (image pull plus health checks),
      # while this boots during checkout and Setup.
      - &start-postgres
        name: Start PostgreSQL
        run: >-
          nohup docker run --name postgres --publish 5432:5432
          --env POSTGRES_USER=user --env POSTGRES_PASSWORD=password
          --env POSTGRES_DB=sokosumi postgres:17 > /tmp/postgres.log 2>&1 &

      - *checkout
      - *setup

      # TCP, not the socket: the image's init server listens on the socket
      # only and restarts before the real server comes up.
      - &wait-postgres
        name: Wait for PostgreSQL
        run: timeout 120 bash -c 'until docker exec postgres pg_isready --host 127.0.0.1 --username user; do sleep 1; done' || { cat /tmp/postgres.log; exit 1; }

      # Apply migrations so Calendar erasure also exercises the actual cascade
      # and outbox triggers, which prisma db push does not install.
      - name: Apply migrations to PostgreSQL
        env: &migrated-db
          DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"
          DATABASE_URL_UNPOOLED: "postgresql://user:password@localhost:5432/sokosumi"
        run: pnpm prisma:migrate:deploy

      # Seconds, so it runs before the PostgreSQL suites. On drift it prints
      # the SQL the next `prisma migrate dev` would generate and exits 2.
      - name: Check Prisma schema matches migrations
        env: *migrated-db
        run: pnpm prisma:check-drift

      - *core-test-deps

      # `optInDbExclude` in apps/core/vitest.config.ts keeps every
      # `src/**/*.postgres.test.ts` out of `test:ci`, so these files run
      # here or they run nowhere.
      #
      # A substring filter rather than a list of filenames, deliberately.
      # An enumerated list degrades silently: `vitest run <name>` treats a
      # name that matches nothing as contributing nothing, so a typo, a
      # rename or a deletion yields "N-1 passed, exit 0" and no warning.
      # Measured on this repository — six names with one misspelt gives
      # "Test Files 5 passed, Tests 49 passed, exit 0" — which is the exact
      # silent failure this step exists to end, reproduced by the step
      # itself. The substring picks up new suites without anyone
      # remembering to come back here, and `--passWithNoTests=false` plus
      # pnpm's `--fail-if-no-match` turn an empty collection into a red
      # build instead of a green one. Same guard as the migration-order
      # check in the packages job below.
      #
      # `optInPostgresFiles` is not what decides this, and an earlier
      # version of this comment claiming the two lists had to be edited
      # together was wrong. Precisely: `cliSelectsOptInDbFile` returns true
      # on `filter.includes(".postgres.test.ts")` before it consults that
      # list, so the list has no bearing on any argument containing that
      # literal — every full path, and the filter below. It is still
      # load-bearing for an abbreviated one: `pnpm --filter core test
      # calendar-erasure` reaches the `names.some(...)` branch and works
      # only because the list holds that file. `opt-in-db-collect.test.ts`
      # pins exactly that.
      #
      # The two lists look parallel and are not, which is what made the old
      # claim plausible. `optInIntegrationFiles` is spread into
      # `optInDbExclude`, so adding to it genuinely excludes a file.
      # `optInPostgresFiles` is not spread anywhere — the glob already
      # excludes those — so adding to it excludes nothing.
      #
      # One file is held out, in `vitest.config.ts` rather than here, so
      # the reason sits with the pattern and a local run behaves the way
      # this does: `push-device-consent.postgres.test.ts` needs
      # `SOK939_TEST_DATABASE_URL` and a separate `sok_939` database that
      # no job in this repository provisions, and it throws during
      # collection instead of skipping. Owning PR #5291.
      #
      # Not full coverage of the repository, only of this package.
      # `packages/database/src/helpers/image-studio-concurrency.postgres.test.ts`
      # is a different vitest project and out of reach of this filter; the
      # packages job below runs only `job-sync.postgres.test.ts`. That one
      # is gated on `IMAGE_STUDIO_TEST_DATABASE_URL` and skips cleanly, so
      # it is a dormant hole rather than a red one — but it is a hole.
      #
      # These files must not share a database: through it they share one
      # job queue. `leaseNextFileIndexJob` takes a pipeline and no
      # workspace filter, so it hands back the globally oldest runnable job
      # — whoever owns it. Two suites on one database steal each other's
      # work and fail on a row the other one wrote, which reads as a flake
      # in whichever file lost the race. `POSTGRES_TEST_DATABASE_PER_WORKER`
      # copies the migrated database once per Vitest worker
      # (`apps/core/src/test/postgres-worker-databases.ts`), so the files
      # run in parallel, each worker on its own copy.
      - name: Test against PostgreSQL
        env: *migrated-db
        run: |
          RUN_DATABASE_INTEGRATION_TESTS=true POSTGRES_TEST_DATABASE_PER_WORKER=true \
            pnpm --filter core --fail-if-no-match test .postgres.test.ts \
            --passWithNoTests=false

  core:
    name: Test Core
    needs: [changes, core-shard, core-db]
    if: ${{ !cancelled() && needs.changes.outputs.core != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check every shard and the PostgreSQL suites passed
        run: |
          test "${{ needs.core-shard.result }}" = success
          test "${{ needs.core-db.result }}" = success

  packages:
    name: Test Packages
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.packages != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      # Booted in the background, as in `core-db` above. The unit tests run
      # first, so it is long up by the time the job sync test needs it.
      - *start-postgres

      # Depth 2 also fetches the parents of the PR merge commit, which the
      # migration check below reads.
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - *setup

      - name: Run Tests
        run: pnpm exec turbo run test:ci --filter="./packages/*"

      - *wait-postgres

      # The fresh container's database is the empty, disposable one the
      # test asks for.
      - name: Test job sync against PostgreSQL
        env:
          JOB_SYNC_TEST_DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"
        run: pnpm --filter @sokosumi/database exec vitest run src/helpers/job-sync.postgres.test.ts

      # Prisma applies an older-dated pending folder without warning, so each
      # folder a PR adds must be stamped after the newest one on its base
      # branch. On pull_request, HEAD is the PR merge commit. Its first parent
      # is that base, and it holds every base folder the PR did not remove.
      # workflow_dispatch has no merge commit, so it compares with the default
      # branch tip. It still runs the check, because its result goes on the
      # same head commit as the PR run's result and could replace a failure.
      # It also runs when the tests above fail, so one run reports both.
      - name: Check migration folders against the base branch
        if: ${{ !cancelled() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ] || ! git rev-parse --verify --quiet "HEAD^2" >/dev/null; then
              echo "::error::HEAD is not the pull request merge commit $GITHUB_SHA with both parents fetched, so HEAD^1 is not the base branch."
              exit 1
            fi
            base="HEAD^1"
          else
            git fetch --no-tags --depth=1 origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
            echo "::notice::Compared with origin/$DEFAULT_BRANCH. If this branch is behind it, its newer folders show as removed. Merge it first."
            base="origin/$DEFAULT_BRANCH"
          fi
          MIGRATION_ORDER_BASE_REF="$base" pnpm --filter @sokosumi/database --fail-if-no-match exec vitest run --passWithNoTests=false src/helpers/migration-prefix-order.test.ts

  cli:
    name: Test CLI
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cli != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      - name: Run Tests
        run: pnpm exec turbo run test:ci --filter=@masumi_network/sokosumi

      # apps/cli is excluded from the `js` filter, so Typecheck, Biome and
      # Build all skip on a CLI-only PR. These three steps carry that
      # coverage instead — without them the CLI would merge on `tsx --test`
      # alone, which strips types rather than checking them.
      - name: Typecheck the CLI
        run: pnpm --filter @masumi_network/sokosumi typecheck

      - name: Lint the CLI
        run: pnpm exec biome check apps/cli

      # Build and launch the compiled binary: the Build job never runs it, and
      # skips it outright on a CLI-only PR, while the CLI test suite exercises
      # source via tsx rather than dist.
      - name: Smoke the built CLI
        run: |
          pnpm --filter @masumi_network/sokosumi build
          node apps/cli/dist/bin/sokosumi.js --version

  local-env:
    name: Test Local env
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.local-env != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      - name: Run Tests
        run: pnpm local-env:test

  ci-config:
    name: Test CI config
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.ci-config != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      - name: Run Tests
        run: pnpm ci:test

  cloud-agent-db:
    name: Test Cloud agent db
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.cloud-agent-db != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      - name: Run Tests
        run: pnpm cloud-agent-db:test

  # Advisory. The DESIGN.md spec is alpha, so the CLI is pinned: a new
  # release can add rules, and adopting them is a deliberate bump here.
  # The CLI exits 0 on warnings, so the summary decides. Warnings fail too:
  # both files lint clean, and a warning is a real defect such as a
  # component pair below WCAG AA contrast.
  design-md:
    name: Lint DESIGN.md
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.design-md != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - *checkout

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Lint each DESIGN.md
        run: |
          status=0
          for file in apps/web/DESIGN.md apps/cmo/DESIGN.md; do
            npx --yes @google/design.md@0.4.0 lint "$file" > lint.json || true
            cat lint.json
            if ! jq -e '.summary.errors == 0 and .summary.warnings == 0' lint.json > /dev/null; then
              echo "::error file=$file::DESIGN.md lint reported errors or warnings"
              status=1
            fi
          done
          exit "$status"

  build:
    name: Build
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.js != 'false' }}
    runs-on: ubuntu-latest
    # A build takes 1-3 minutes. A hung one otherwise holds the required
    # check for GitHub's 6-hour default.
    timeout-minutes: 10
    permissions: *turbo-permissions
    steps:
      # Booted in the background, as in `core-db` above.
      - *start-postgres
      - *checkout
      - *setup

      - name: Load build env
        run: grep -v '^#' .github/ci-build.env >> "$GITHUB_ENV"

      # Next 16.3 writes a Turbopack build cache to .next/cache.
      # next-build-cache.yml saves one from main and PRs restore the newest.
      # Skipped when web is unchanged: turbo then replays web#build from the
      # remote cache.
      - name: Restore Next.js build cache
        if: needs.changes.outputs.web != 'false'
        uses: actions/cache/restore@v6
        with:
          path: apps/web/.next/cache
          key: js-next-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: js-next-${{ runner.os }}-${{ runner.arch }}-

      - *wait-postgres

      - name: Run Prisma Migrate
        run: pnpm prisma:migrate:dev

      - name: Run Build
        run: pnpm build

  biome:
    name: Biome
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.js != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - *checkout

      # Biome is one binary with no workspace dependencies: nested
      # biome.json files extend the root and the Grit plugin is a repo
      # file. So no Setup and no install. setup-biome takes the exact
      # version from package.json: it cannot parse pnpm 12's
      # two-document pnpm-lock.yaml.
      - name: Install Biome
        uses: biomejs/setup-biome@v2

      - name: Run Biome checks
        run: biome check .

  typecheck:
    name: Typecheck
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.js != 'false' }}
    runs-on: ubuntu-latest
    permissions: *turbo-permissions
    steps:
      - *checkout
      - *setup

      - name: Run TypeScript typecheck
        run: pnpm typecheck
