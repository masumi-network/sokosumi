name: PR closed
# Actions run title. preview-deploy's per-PR queue reads this back as
# workflow_run.display_title. pull_requests is empty once the PR is closed.
run-name: ${{ github.event.pull_request.number }}

# Unprivileged signal. `cloud-agent-db-teardown.yml` and `preview-deploy.yml`
# listen via workflow_run so the privileged YAML always comes from the default
# branch. pull_request_target would load YAML from the PR base, which a
# same-repo branch can replace. Do not add synchronize here: teardown must
# not run on every push.
permissions:
  contents: read

on:
  pull_request:
    types: [closed]

jobs:
  closed:
    name: Signal PR closed
    runs-on: ubuntu-latest
    steps:
      - name: Record close
        run: echo "PR ${{ github.event.pull_request.number }} closed"
