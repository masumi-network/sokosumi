name: Build
permissions:
  contents: read
  pull-requests: write

on:
  workflow_dispatch:
  pull_request:

env:
  DATABASE_URL: "postgresql://user:password@localhost:5432/sokosumi"
  BETTER_AUTH_SECRET: "ci-build-better-auth-secret"
  POSTMARK_SERVER_ID: "ci-postmark-server-id"
  POSTMARK_FROM_EMAIL: "ci@sokosumi.com"
  NEXT_PUBLIC_NETWORK: "Preprod"
  SOKOSUMI_API_URL: "https://api.sokosumi.com"
  PAYMENT_API_KEY: "ci-payment-api-key"
  REGISTRY_API_KEY: "ci-registry-api-key"
  STRIPE_PUBLISHABLE_KEY: "pk_test_ci_build_placeholder"
  STRIPE_SECRET_KEY: "sk_test_ci_build_placeholder"
  STRIPE_WEBHOOK_SECRET: "whsec_ci_build_placeholder"
  STRIPE_WELCOME_COUPON: "ci-stripe-welcome-coupon"
  STRIPE_CREDIT_PRODUCT_ID: "ci-stripe-credit-product-id"
  STRIPE_STARTER_SUBSCRIPTION_PRODUCT_ID: "ci-stripe-starter-subscription-product-id"
  STRIPE_STANDARD_SUBSCRIPTION_PRODUCT_ID: "ci-stripe-standard-subscription-product-id"
  STRIPE_PRO_SUBSCRIPTION_PRODUCT_ID: "ci-stripe-pro-subscription-product-id"
  STRIPE_ONBOARD_PERSONAL_COUPON: "ci-stripe-onboard-personal-coupon"
  STRIPE_ONBOARD_ORGANIZATION_COUPON: "ci-stripe-onboard-organization-coupon"
  ABLY_SUBSCRIBE_ONLY_KEY: "ci-ably-subscribe-only-key"
  ABLY_PUBLISH_ONLY_KEY: "ci-ably-publish-only-key"
  ANTHROPIC_API_KEY: "sk-ant-api03-01JN000000000000000000000"
  GOOGLE_CLIENT_ID: "ci-google-client-id"
  GOOGLE_CLIENT_SECRET: "ci-google-client-secret"
  MICROSOFT_CLIENT_ID: "ci-microsoft-client-id"
  MICROSOFT_CLIENT_SECRET: "ci-microsoft-client-secret"
  AFTER_AGENT_HIRED_WEB_HOOK: https://after-agent-hired-web-hook.com
  MARKETING_OPT_IN_WEB_HOOK: https://marketing-opt-in-web-hook.com

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: sokosumi
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install

      - name: Run Tests
        run: pnpm test:ci

      - name: Run Prisma Migrate
        run: pnpm prisma:migrate:dev

      - name: Run Build
        run: pnpm build
