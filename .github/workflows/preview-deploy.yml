name: Preview deploy

on:
  issue_comment:
    types: [created]
  # pull_request_target so the workflow YAML comes from the default branch.
  # pull_request would run this file from the PR merge commit WITH
  # VERCEL_TOKEN, so a same-repo branch that edits this workflow can exfil
  # the token or production-deploy on open (merge is not required).
  pull_request_target:
    types: [opened]
    # Previews only build web/core and their workspace package dependencies;
    # docs-only (and similar) PRs never start this workflow. Keep in sync with
    # PREVIEW_RELEVANT_PREFIXES in scripts/ci/vercel-deploy.mjs (the /deploy
    # comment flow enforces the same prefixes via the PR files API).
    paths:
      - "apps/web/**"
      - "apps/core/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  comment:
    name: Comment preview
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/deploy') &&
      !(startsWith(github.event.comment.body, '/deploy') && contains(github.event.comment.body, '--reset-db'))
    # All three jobs share one group per PR. A Core build during a reset could
    # migrate the branch before or after the restore. Every job in the group
    # needs `queue: max`: with the default, a newer job cancels the one that
    # waits, whichever job that is.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (VERCEL_TOKEN). Default branch only — never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/vercel-deploy.mjs preview

  opened:
    name: Opened preview
    # Do not add this job as a required check: it only runs on opened, so later
    # commits would have no check on the new SHA.
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (VERCEL_TOKEN). Default branch only — never a PR tree
          # or base tip. Vercel still deploys the PR head commit via the API.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node scripts/ci/vercel-deploy.mjs preview

  reset-db:
    name: Reset preview database
    # Start only for a comment that begins with `/reset-db`, or with `/deploy`
    # and holds `--reset-db`. As for `/deploy`, the script then requires write
    # access. The comment's author_association is no gate: GitHub can report a
    # private organization member as CONTRIBUTOR. The `comment` job skips the
    # `/deploy` comments that this job takes.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/reset-db') || (startsWith(github.event.comment.body, '/deploy') && contains(github.event.comment.body, '--reset-db')))
    # The per-network Neon preview keys live in this environment. Limit the
    # environment to the default branch: issue_comment runs from it, and runs
    # on other branches then cannot read the keys.
    environment: preview-database
    # A reset drops open connections, so it waits for the PR's other preview
    # jobs, and they wait for it. See the `comment` job.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    # The job must outlast the script, or no reply posts. Neon takes about 17
    # minutes for two networks with one operation each: each request stops
    # after 30 seconds, a restore tries up to 5 times, and each network polls
    # for up to 5 minutes. An operation still running then gets one more poll
    # of up to 35 seconds. The Vercel deployments (Core, or web and Core for
    # `/deploy --reset-db`) are polled together and add up to 15 minutes.
    # Vercel and GitHub requests have no time limit of their own.
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (Neon preview keys, VERCEL_TOKEN). Default branch only,
          # never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Reset preview database
        env:
          NEON_PREVIEW_API_KEY_MAINNET: ${{ secrets.NEON_PREVIEW_API_KEY_MAINNET }}
          NEON_PREVIEW_API_KEY_PREPROD: ${{ secrets.NEON_PREVIEW_API_KEY_PREPROD }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/preview-db-reset.mjs
