name: Preview deploy

on:
  issue_comment:
    types: [created]
  # Cleanup always runs trusted default-branch code, including docs-only PRs.
  pull_request_target:
    types: [closed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comment:
    name: Comment preview
    environment: preview-database
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/deploy') &&
      !(startsWith(github.event.comment.body, '/deploy') && contains(github.event.comment.body, '--reset-db'))
    # Deploy, reset, and cleanup share one group per PR. A Core build during a reset could
    # migrate the branch before or after the restore. Each job waits for every
    # deployment it starts, also after one fails. A build that outlasts the
    # 15-minute poll limit, a create whose response is lost (no id to poll),
    # or a cancelled job can still overlap a later reset. Every job in the group needs `queue: max`: with the default, a
    # newer job cancels the one that waits, whichever job that is.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (VERCEL_TOKEN). Default branch only — never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
        run: node scripts/ci/vercel-deploy.mjs preview

  reset-db:
    name: Reset preview database
    # Start only for a comment that begins with `/reset-db`, or with `/deploy`
    # and holds `--reset-db`. As for `/deploy`, the script then requires write
    # access. The comment's author_association is no gate: GitHub can report a
    # private organization member as CONTRIBUTOR. The `comment` job skips the
    # `/deploy` comments that this job takes.
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      (startsWith(github.event.comment.body, '/reset-db') || (startsWith(github.event.comment.body, '/deploy') && contains(github.event.comment.body, '--reset-db')))
    # The Neon preview project ids live in this environment. Limit the
    # environment to the default branch: issue_comment runs from it.
    environment: preview-database
    # A reset drops open connections, so it waits for the PR's other preview
    # jobs, and they wait for it. See the `comment` job.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    # The job must outlast the script, or no reply posts. Neon takes about 17
    # minutes for two networks with one operation each: each request stops
    # after 30 seconds, a restore tries up to 5 times, and each network polls
    # for up to 5 minutes. An operation still running then gets one more poll
    # of up to 35 seconds. The Vercel deployments (Core, or web and Core for
    # `/deploy --reset-db`) are polled together and add up to 15 minutes.
    # Vercel and GitHub requests have no time limit of their own.
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (NEON_API_KEY, VERCEL_TOKEN). Default branch only,
          # never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Reset preview database
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/preview-db-reset.mjs

  closed:
    name: Closed preview
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
      queue: max
    environment: preview-database
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Clean up preview resources
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
        run: node scripts/ci/preview-cleanup.ts

  inventory:
    name: Preview cleanup inventory
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    outputs:
      prs: ${{ steps.cleanup.outputs.prs }}
    environment: preview-database
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Clean up preview resources
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
        run: node scripts/ci/preview-cleanup.ts inventory

  reconcile:
    name: Reconcile closed previews
    needs: inventory
    if: needs.inventory.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        pr: ${{ fromJSON(needs.inventory.outputs.prs) }}
    concurrency:
      group: ${{ github.workflow }}-${{ matrix.pr }}
      cancel-in-progress: false
      queue: max
    environment: preview-database
    permissions:
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - name: Clean up preview resources
        id: cleanup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PREVIEW_PROJECT_ID_MAINNET: ${{ vars.NEON_PREVIEW_PROJECT_ID_MAINNET }}
          NEON_PREVIEW_PROJECT_ID_PREPROD: ${{ vars.NEON_PREVIEW_PROJECT_ID_PREPROD }}
          PREVIEW_PR_NUMBER: ${{ matrix.pr }}
        run: node scripts/ci/preview-cleanup.ts
