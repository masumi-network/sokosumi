name: Preview deploy

on:
  issue_comment:
    types: [created]
  # pull_request_target so the workflow YAML comes from the default branch.
  # pull_request would run this file from the PR merge commit WITH
  # VERCEL_TOKEN, so a same-repo branch that edits this workflow can exfil
  # the token or production-deploy on open (merge is not required).
  pull_request_target:
    types: [opened]
    # Previews only build web/core and their workspace package dependencies;
    # docs-only (and similar) PRs never start this workflow. Keep in sync with
    # PREVIEW_RELEVANT_PREFIXES in scripts/ci/vercel-deploy.mjs (the /deploy
    # comment flow enforces the same prefixes via the PR files API).
    paths:
      - "apps/web/**"
      - "apps/core/**"
      - "packages/**"

permissions:
  contents: read

jobs:
  comment:
    name: Comment preview
    if: >
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      github.event.comment.user.type != 'Bot' &&
      contains(github.event.comment.body, '/deploy')
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (VERCEL_TOKEN). Default branch only — never a PR tree.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci/vercel-deploy.mjs preview

  opened:
    name: Opened preview
    # Do not add this job as a required check: it only runs on opened, so later
    # commits would have no check on the new SHA.
    if: >
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Privileged (VERCEL_TOKEN). Default branch only — never a PR tree
          # or base tip. Vercel still deploys the PR head commit via the API.
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Deploy preview
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_TEAM_ID }}
        run: node scripts/ci/vercel-deploy.mjs preview
